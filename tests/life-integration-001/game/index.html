o_paid:{day:31,tag:'첫 정산',title:'회사 입금일 다음 날',art:24,notification:s=>s.flags.rebate?{from:'태준',amount:s.flags.negotiatedRebateAmount||6000000}:s.flags.reported?{from:'회사 / 자료 정리 수당',amount:1000000}:null,enter:s=>{if(s.flags.rebate)fx(s,{cash:s.flags.negotiatedRebateAmount||6000000});if(s.flags.reported)fx(s,{cash:1000000});},body:s=>s.flags.rebate?['태준에게서 '+money(C.rebateAmount(s))+'이 입금됐다. 회사에서는 아직 아무 연락이 없다.','민서가 점심을 먹다가 견적서 얘기를 꺼냈다.']:s.flags.reported?['검증 자료 정리 수당 100만 원이 입금됐다. 거래처를 바꾸느라 행사 준비가 일주일 늦어졌다.','민서가 퇴근길 엘리베이터에서 물었다.']:['첫 급여가 기간에 따라 들어왔다. 태준은 업무 메일에만 답하고 있다.','민서가 자기 휴대폰을 내 쪽으로 돌렸다.'],chat:s=>[say('민서',s.flags.reported?'다음 검증도 네가 맡는 거야? 지금 업무도 많은데 급여 얘기는 했어?':s.flags.rebate?'수정 견적, 처음 거랑 금액 다르지 않았어? 내가 잘못 본 건가.':'나한테도 개인 계좌 물어보던데. 너한테도 그랬어?')],choices:s=>[
pick(s.flags.rebate?'“달랐어. 네가 본 거 맞아.”':'민서와 자료를 같이 확인한다','업무 자료와 아는 내용을 공유','o_work',s=>{fx(s,{flags:{confided:true,records:true},relations:{minseo:2}});return{text:s.flags.rebate?'입금받은 사실까지 말했다. 민서가 한참 말이 없다가 “다음 건은 나 끌어들이지 마”라고 했다.':'민서와 담당 범위를 나눴다. 서로 받은 견적을 같은 폴더에 보관하기로 했다.'};}),
pick(s.flags.reported?'추가 업무 보수를 팀장에게 묻는다':'“내가 확인할게. 일단 보내줘.”',s.flags.reported?'검증 업무 범위와 보수 협의':'직접 처리 / 민서와 공유하지 않음','o_work',s=>{if(s.flags.reported){fx(s,{salary:3200000,career:5,flags:{officialRaise:true}});return{text:'팀장과 정산 검증 업무를 포함해 월 320만 원으로 계약을 바꿨다.'};}fx(s,{flags:{hidInvoice:true},relations:{minseo:-1}});return{text:'민서는 알겠다고 답했다. 그 뒤로는 내 담당 견적에 따로 손대지 않았다.'};})]},

o_credit:{day:97,tag:'담당 변경 / 민서',title:'작성자 칸에 내 이름',art:34,body:s=>['태준에게 받은 800만 원은 통장에 그대로 있다. 팀장이 새 행사 자료를 단체방에 올렸다.','민서가 만든 비교표인데, 담당자가 바뀌면서 작성자도 내 이름으로 적혀 있다.'],chat:s=>[say('팀장','미미 씨가 이번 건 잘 정리했네요. 다음 발주도 맡아주세요.'),say('민서','저 표 내가 만든 거잖아. 네가 담당 바꿔달라고 한 거야?')],choices:s=>[

o_review:{day:112,tag:'업무 / 후속 확인',title:s=>s.flags.rebate&&s.flags.audit&&!s.flags.returnedRebate?'지급 내역을 확인해 주세요':'다음 달 담당자',art:28,body:s=>s.flags.rebate&&s.flags.audit&&!s.flags.returnedRebate?['회사 회계 담당자가 정상 견적과 지급 금액이 다르다며 자료를 요청했다. 태준에게도 같은 요청이 갔다.',s.flags.claimedCredit?'회계 담당자는 민서에게도 원본을 요청했다. 민서는 나를 거치지 않고 자기 자료를 직접 제출했다.':s.flags.confided?'민서가 전에 말한 입금 내역도 같이 정리하라고 했다.':'민서는 내가 받은 돈을 모른다. 자기 폴더에 있던 정상 견적을 회계 담당자에게 보냈다.']:s.flags.returnedRebate?['회사는 정정된 지급 내역을 확인했다. 태준 업체에는 새 발주를 넣지 않기로 했다.','팀장은 내 담당 거래를 다른 사람에게 넘겼다. 급여는 그대로지만 다음 재계약은 다시 논의하기로 했다.']:['다음 달 담당표가 나왔다.',s.flags.sideWork?'외주 담당자가 정산 업무를 계속 맡아달라고 했다. 다른 프로젝트 담당자에게도 연락처를 전달했다고 한다.':(s.relations.minseo>=2?'민서가 주말 행사 한 건을 따로 소개했다.':'행사 업체에서 주말 업무 공고를 올렸다.')+' 회사 밖에서 받는 일이라 보수는 직접 협상해야 한다.'],chat:s=>s.flags.rebate&&s.flags.audit&&!s.flags.returnedRebate?[say('태준','일단 제가 자료 보내볼게요. 미미 씨가 받은 건 따로 얘기하지 마시고요.')]:s.flags.claimedCredit?[say('민서','내 자료 필요하면 메일로 요청해줘. 단체방 말고.')]:s.flags.creditedMinseo?[say('민서','다음 견적은 서로 받은 거 먼저 맞춰보자.')]:[],choices:s=>s.flags.rebate&&s.flags.audit&&!s.flags.returnedRebate?[
pick('입금 내역과 원본을 제출한다','받은 차액 반환 / 회사 관계 악화','o_life',s=>{const n=C.rebateOutstanding(s);const loan=spend(s,n);fx(s,{flags:{invoiceOpen:false,rebateReturnedAmount:C.rebateTotal(s),settledAudit:true,lostRole:true},relations:{vendor:-3},mind:-8});return{text:'회사는 받은 차액을 반환받고 담당 업무를 바꿨다. '+(loan?'모자란 '+money(loan)+'은 추가로 빌렸다.':'입금받은 돈은 전액 반환했다.')+' 계약 종료까지는 다른 문서 업무를 맡는다.'};}),
pick('태준에게 맡기고 기존 설명을 유지한다','입금 유지 / 상대가 제출할 자료는 미확인','o_life',s=>{const caught=random(s)<0.55;if(caught){fx(s,{job:'none',salary:0,flags:{dismissed:true,unresolvedAudit:true,lostRole:true},relations:{minseo:-2},mind:-12});return{outcome:{kind:'failure',label:'대응 실패',attempt:'감사 확인 대응'},text:'태준이 보낸 지급 정리표와 내가 낸 설명의 날짜가 달랐다. 추가 확인 끝에 개인 입금도 드러났다. 회사는 계약을 종료하고 차액 반환을 요구했다.'};}fx(s,{flags:{auditPassed:true},mind:-4});return{outcome:{kind:'success',label:'대응 성공',attempt:'감사 확인 대응'},text:'태준이 수정 계약서를 제출했다. 이번 확인은 끝났다. 회사는 내가 받은 차액까지 확인하지 못했다.'};})
]:[

function summary(s){const out=[...loungeSummary(s)];if(s.flags.route==='office'){if(s.flags.rebate){if(s.flags.settledAudit||s.flags.returnedRebate)out.push(C.rebateOutstanding(s)>0?'이전 저장에는 차액 일부만 반환한 기록이 남아 있다. 남은 반환액 '+money(C.rebateOutstanding(s))+'은 대출 잔액과 별개다.':'태준에게서 받은 차액은 전액 반환했다. 그 거래는 다시 맡지 않는다.');else if(s.flags.unresolvedAudit)out.push('회사는 계약을 종료했다. 받은 차액의 반환 요구가 남아 있어 대출과 별도로 정리해야 한다.');else out.push((s.flags.secondDeal?'두 번의 거래로 받은 '+money((s.flags.negotiatedRebateAmount||6000000)+8000000):'한 번의 거래로 받은 '+money(s.flags.negotiatedRebateAmount||6000000))+'은 보유하고 있다. 회사는 개인 입금을 확인하지 못했다.');}else if(s.flags.reported)out.push('거래처 제안은 회사에 보고했다. 자료 정리 수당 100만 원을 받았다.');else out.push('태준의 개인 입금 제안은 거절했다. 회사 급여와 맡은 일의 보수로 생활했다.');out.push(s.flags.claimedCredit?'팀장에게는 다음 발주도 맡겠다고 답했다. 민서의 원본 파일 열람 권한은 돌아오지 않았다.':s.flags.admittedTransfer?'민서에게 담당 변경을 인정했다. 그 뒤로 원본 파일은 메일로 받았다.':s.flags.creditedMinseo?'단체방의 비교표에는 민서의 이름이 남았다.':s.flags.sharedWork?'민서와 외주 일을 나눠 맡고 보수도 반씩 받았다.':s.flags.confided?(s.flags.rebate?'민서에게 받은 입금 내역과 업무 자료를 공유했다.':'민서와 원래 견적과 업무 자료를 같이 확인했다.'):s.relations.minseo<0?'민서와는 업무 메일만 주고받는다.':'민서에게 다음 근무 일정을 보냈다.');}else if(s.flags.route==='night'){if(s.support&&s.day<s.supportEnd)out.push('도윤과의 지원은 월 '+money(s.support)+'으로 이어지고 있다. '+(s.flags.patronKind==='steady'?'추가 일정은 따로 합의한다.':'갱신 때 합의한 추가 만남과 연락 조건도 남아 있다.'));else if(s.flags.supportMode==='declined')out.push('도윤의 정기 지원은 받지 않았다. 이후 일과 보수는 따로 구했다.');else out.push('도윤의 지원은 끝났다. 남아 있는 돈은 받기로 합의했던 기간의 지원금과 일한 보수다.');if(s.flags.lentSoha)out.push(s.flags.sohaPaid?'소하에게 빌려준 100만 원은 돌려받았다.':'소하에게 빌려준 100만 원은 아직 받지 못했다. 대출 잔액에는 포함하지 않았다.');else out.push(s.flags.canceledSoha&&!s.flags.helpedSoha?'소하와는 일 얘기로 연락한다. 취소했던 생일 저녁은 아직 다시 잡지 않았다.':s.flags.helpedSoha?'이삿짐을 옮긴 날 소하와 점심을 먹었다. 다음에는 일 얘기 말고 보자고 했다.':s.relations.soha>=2?'소하와는 일자리와 근무 소식을 주고받는다.':'소하에게 다음 근무 일정을 보냈다.');}if(s.flags.route==='streamer')out.push(s.flags.privateFan?'개인 통화를 요구했던 후원자와의 연락이 이어졌다.':'후원자와의 개인 연락은 하지 않았다.',s.flags.sponsoredAd?'광고 계약을 진행했다. 방송 댓글에는 제품 사용 여부를 묻는 글이 남았다.':'광고 계약은 진행하지 않았다.');
if(s.flags.route==='retail')out.push(s.flags.coveredTill?'포스 부족액 40만 원을 본인 돈으로 채웠다.':'포스 부족액은 마감 자료를 확인해 처리했다.',s.flags.retailToOffice?'물류회사 관리직으로 옮겼다.':'편의점 야간 근무를 계속했다.');
if(s.flags.route==='model')out.push(s.flags.unverifiedShoot?'계약서 확인 전 개인 촬영을 진행했다. 사진 사용 범위는 아직 확인되지 않았다.':'개인 촬영 제안은 계약 조건을 확인하거나 거절했다.',s.flags.adShoot?'광고 촬영을 마쳤고 다음 일은 아직 정해지지 않았다.':'기존 촬영 관련 일을 유지했다.');
if(s.flags.nextProject)out.push('다음 프로젝트의 시작일은 이번 결산일 이후로 잡혀 있다.');out.push('현재 일은 '+C.jobName(s)+'. 월 근로수입은 '+money(s.salary)+'이다.');if(s.flags.invested)out.push(s.flags.investmentWon?'팝업 투자에서 순이익 500만 원을 얻었다. 다음 행사 참여는 아직 정하지 않았다.':'팝업 투자에서 250만 원을 잃었다. 다음 행사에는 아직 답하지 않았다.');if(s.debt===0)out.push('대출 앱에는 잔액 0원이 표시된다. 다음 달에도 월세와 생활비는 나간다.');else out.push('남은 대출은 '+money(s.debt)+'. 이번에 남긴 현금은 '+money(s.cash)+'이다.');return out;}

 case 'o_life':if(s.job==='none'){tag(index===0?'월 급여 '+won(2400000):'보수 +'+won(1200000),'reward');if(index===1)tag('단기 업무 / 피로 증가','cost');}else if(index===0){tag('보수 +'+won(s.health<45?600000:s.career>=35?2400000:1500000),'reward');tag(s.health<45?'자료 정리 하루':'현장 사흘');tag('피로 증가','cost');}else tag('추가 수입 없음 / 휴식');break;
 case 'n_first':if(index===0){tag('추가 정산 +'+won(600000),'reward');tag('근무 연장 / 피로 증가','cost');}else if(index===1)tag('현재 정산 조건 유지');else tag('추가 교육 시간');break;
 case 'n_meet':tag(index===1?'가게 안에서만 만남':index===2?'소하 동행':'개인 연락처 공유');break;
 case 'n_offer':if(index===0){tag('월 지원 '+won(3000000),'reward');tag('퇴사 / 90일 지원');tag('주 2회 저녁');}else if(index===1){tag('협의 성사 시 월 '+won(1500000),'reward');tag('조건 협상 / 근무 유지');}else tag('현재 근로수입 유지');break;
 case 'n_conditions':if(s.support){if(index===0)tag('추가 보수 없음 / 기존 일정 요청');else if(index===1){tag('추가 보수 +'+won(s.flags.patronKind==='steady'?2000000:4000000),'reward');tag('생일 약속 취소','cost');tag('피로 증가','cost');if(s.salary)tag('빠지는 근무 정산 −'+won(350000),'cost');}else tag('정기 지원 종료');}else{if(index===0)tag('채용 시 월 '+won(2800000),'reward');else if(index===1){tag('월 정산 예상 '+won(5000000),'reward');tag('야간 업무 증가','cost');}else{tag('보수 +'+won(1000000),'reward');tag('추가 업무 / 피로 증가','cost');}}break;
 case 'n_follow':if(t.includes('교육 자료')){tag('내 보수 +'+won(s.relations.soha>0?1200000:600000),'reward');tag('분담 작업 / 피로 증가','cost');}else if(t.includes('그날 도윤')){tag('지원 관계 정보 공개');tag('이번 교육 보수 없음');}else if(t.includes('사무직')){tag('채용 시 월 '+won(2800000),'reward');if(s.support)tag('현재 지원은 재협의');}else if(t.includes('도윤과')){tag('별도 입금 +'+won(1000000),'reward');tag('월 지원 '+won(3000000),'reward');tag('종료일까지 '+Math.max(0,s.supportEnd-s.day)+'일');}else tag(s.salary||s.support?'현재 수입 유지 / 휴식':'정기 수입 없음');break;

 case 'v_model':if(index===1){tag('촬영 보수 +'+won(3000000),'reward');tag('사용 범위 미확인','risk');}else tag('계약서 요청 / 보수 없음');break;
 case 'v_model2':if(index===0){tag('촬영 보수 +'+won(4500000),'reward');tag('기존 근로수입 종료','cost');}else tag('월 기본 보수 '+won(1700000),'reward');break;
 case 'common_opportunity':if(index===0){tag('성공 확률 '+Math.round(D.investmentRate(s)*100)+'%','chance');tag('고위험','risk');tag(won(3000000)+' 필요','cost');tag('투자금 −'+won(3000000),'cost');tag('성공 시 총 정산 '+won(8000000),'reward');note='총 정산에는 투자금 회수분이 포함돼. 실패하면 투자금 손실 가능.';}else if(index===1){tag('보수 +'+won(900000),'reward');tag('사흘 근무 / 피로 증가','cost');}else tag('투자와 근무 모두 참여 안 함');break;
 case 'last':{const pay=index===0?Math.min(s.debt,Math.max(0,s.cash-s.rent-s.living)):index===1?Math.min(s.cash,s.debt):0;tag('추가 상환 '+won(pay),pay?'cost':'condition');if(index===0)tag('월세 / 생활비 '+won(s.rent+s.living)+' 확보 목표');if(index===1)tag('생활비까지 사용할 수 있음','risk');break;}

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.hidden=true,3200);}
function capture(s){if(!s.transcript)s.transcript=[];if(s.transcript.some(e=>e.id===s.scene))return;const sc=S[s.scene];if(sc.ending)return;s.transcript.push({id:s.scene,day:s.day,title:val(sc.title,s),body:val(sc.body,s),chat:sc.chat?sc.chat(s):[]});}
function shellPhoto(art,label){const id=state?.scene;let src=null,note='この場面';if(id==='n_life'){src='../assets/art-24.webp';note='日常';}if(id==='n_contract'){src='../assets/contract-review.webp';note='契約';}if(id==='n_preparation'&&['solo','joint'].includes(state.flags.loungeContract)&&state.history.at(-1)?.scene==='n_contract'){src='../assets/art-33.webp';note='結果';}const labels={日常:'일상 연락 / 기존 원화',契約:'계약 검토 / 돌아보기 구도 시범',結果:'계약 이후 / 서류와 비용 확인'};return '<figure class="scene-photo">'+(src?'<img src="'+src+'" alt="'+labels[note]+'">':'<div class="asset-missing">이 장면에 맞는 임시 자산 없음</div>')+'<figcaption>'+esc(src?labels[note]:'누락 자산으로 기록 / 무관한 이미지 대체 안 함')+'</figcaption><p class="temp-art-note">검토용 임시 매핑 / 최종 외형 미승인'+(id==='n_contract'?' / 대면 설정 미확정 / 정지 원화':'')+'</p></figure>';}
function landing(){app.innerHTML='<section class="landing fade-in"><div class="landing-copy"><div class="eyebrow">다크 인생 시뮬레이션</div><h1>아직<br>안 <em>망했다.</em></h1><div class="intro-description"><p>김미미, 스물여섯.<br>내 이름으로 남은 빚 3,000만 원.<br>이번 달부터는 내가 갚아야 한다.</p><p>출근할 곳을 고르고, 제안을 받고,<br>그다음에 벌어지는 일까지.</p></div><div class="intro-facts"><div><small>내 통장</small><strong>30만 원</strong></div><div><small>남은 빚</small><strong>3,000만 원</strong></div><div><small>이번 이야기</small><strong>180일</strong></div></div><div class="start-actions">'+(state?'<button class="primary" id="continue">'+(state.ended?'지난 결과 보기':'이어하기')+' <span>↗</span></button><button class="secondary" id="start">새 인생 시작</button>':'<button class="primary" id="start">내 인생 시작하기 <span>↗</span></button>')+'</div><p class="subtle '+(!saveOK?'save-error':'')+'">'+(!saveOK?'자동 저장을 사용할 수 없어. 메뉴에서 백업 파일을 받을 수 있어.':invalidSave?'이전 저장을 읽지 못했어. 새로 시작하기 전 메뉴에서 저장을 확인해줘.':'이 브라우저에 자동 저장 / 이전 버전의 진행은 보존돼.')+'</p></div><div class="landing-visual"><div class="tape"></div><div class="photo-frame"><img src="../assets/art-24.webp" alt="휴대폰을 확인하는 순정만화풍의 주인공"><div class="photo-note">NOVEMBER, A NEW START</div></div><div class="floating-note">대출 잔액<b>30,000,000원</b>납부 예정 알림이 도착했어요.</div><span class="star" aria-hidden="true">✧</span></div></section><div class="home-bottom"><span>01 / 첫 번째 본게임 버전</span><span>편의점에서 시작하는 네 갈래<br>모든 인물은 성인인 가상 인물이야.</span></div>';document.getElementById('start').onclick=requestNew;const b=document.getElementById('continue');if(b)b.onclick=()=>{home=false;render();};}
function requestNew(){if(state||invalidSave){show('<h2>새 인생을 시작할까?</h2><p>현재 v2 진행은 새 게임으로 바뀌어. 이전 버전의 저장은 건드리지 않아.</p><div class="modal-actions"><button class="secondary" id="export-before">현재 진행 백업</button><button class="primary" id="new-confirm">새 인생 시작</button><button class="secondary" id="new-cancel">돌아가기</button></div>');document.getElementById('export-before').onclick=exportSave;document.getElementById('new-confirm').onclick=()=>{modal.close();newGame();};document.getElementById('new-cancel').onclick=()=>modal.close();}else newGame();}
function newGame(){state=C.initial();capture(state);invalidSave=false;home=false;save();render();window.scrollTo(0,0);}
function delta(){if(!state.last)return '';const last=state.last,split=!!last.choiceDelta,d=last.choiceDelta||Object.fromEntries(['cash','debt','health','mind','career'].map(k=>[k,last.after[k]-last.before[k]]));let list=[];
for(const [k,label]of [['cash','현금'],['debt','빚'],['health','건강'],['mind','멘탈'],['career','경력']]){const n=d[k];if(!n)continue;if(k==='cash'&&last.notification?.amount===n&&!last.transactions?.length)continue;const good=k==='debt'?n<0:n>0;list.push('<span class="'+(good?'pos':'neg')+'">'+(k==='cash'?(last.transactions?.length?'현금 순변화':'현금'):label)+' '+(n>0?'+':'−')+(k==='cash'||k==='debt'?short(Math.abs(n)):Math.abs(n))+'</span>');}
if(last.before.job!==last.after.job)list.push('<span>직업 / '+esc(C.jobName(state))+'</span>');
if(split){for(const k of ['salary','support'])if(d[k])list.push('<span>월 '+(k==='salary'?'근로':'지원')+' '+short(last.monthlyBefore[k])+' → '+short(last.monthlyAfter[k])+'</span>');}
return (list.length?'<div class="delta" aria-label="'+(split?'이 선택으로 생긴 변화':'전체 변화 / 기간 정산 포함')+'">'+list.join('')+'</div>':'')+(!split?'<p class="legacy-note">이전 기록의 전체 변화야. 경과 기간 정산이 포함돼.</p>':'');}
function receipt(){if(!state.last)return '';const last=state.last,l=state.ledger,n=last.notification,o=last.outcome;
const badge=o?'<div class="outcome-banner '+esc(o.kind)+'" role="status"><strong>'+(o.kind==='success'?'성공':'실패')+'</strong><span>'+esc(o.attempt)+' / '+esc(o.label)+'</span></div>':'';
const notice=n&&!last.transactions?.some(t=>t.source==='entry')?'<div class="bank-notice" role="status"><small>입금 알림 / '+esc(n.from)+'</small><b>+'+won(n.amount)+'</b></div>':'';
const flows=last.transactions?.length?'<dl class="transaction-list">'+last.transactions.map(t=>'<div><dt>'+esc(t.label)+'</dt><dd class="'+(t.amount>=0?'pos':'neg')+'">'+(t.amount>=0?'+':'−')+won(Math.abs(t.amount))+'</dd></div>').join('')+'</dl>':'';
const legacy=state.flags.returnedRebate&&C.rebateOutstanding(state)>0?'<p class="legacy-note">이전 저장의 차액 반환 기록에 '+won(C.rebateOutstanding(state))+'이 남아 있어. 현금과 대출은 자동 변경하지 않았어.</p>':'';
return legacy+badge+'<div class="receipt"><div class="result-heading">선택한 뒤</div><p>'+esc(last.text)+'</p>'+notice+flows+delta()+(l&&l.to>l.from?'<details class="period"><summary>'+(l.to-l.from)+'일 경과 / 기간 정산 보기</summary><p>근로 '+short(l.salary)+' / 지원 '+short(l.support)+'<br>생활비 '+short(l.cost)+' / 이자 '+short(l.interest)+(l.arrears?' / 부족 생활비는 빚에 반영':'')+(last.periodDelta?'<br>기간 중 현금 순변화 '+(last.periodDelta.cash>=0?'+':'−')+short(Math.abs(last.periodDelta.cash)):'')+'</p></details>':'')+'</div>';}
function choiceHTML(c,i,sc){const d=U.describe(state.scene,state,c,i);if(c.hidden){d.labels.unshift({text:'✦ 히든 / '+PERSONALITIES.find(p=>p[0]===state.personality)?.[1],kind:'reward'});d.dialogue=c.text;d.action=c.hint;d.note='성격 전용 선택지';}const riskTags=[];if(c.hidden&&/협상|불확실|철회/.test(c.hint))riskTags.push('결과 불확실');if(state.scene==='o_offer'&&(i===0||c.hidden&&state.personality==='ambition'))riskTags.push('법적 위험');if(['n_offer','n_conditions','n_renew'].includes(state.scene)&&i===0)riskTags.push('인생 분기');if(['n_meet','n_conditions','n_life'].includes(state.scene)&&i>0)riskTags.push('관계 위험');if(['v_stream','v_model'].includes(state.scene)&&i===0)riskTags.push('관계/계약 위험');if(state.scene==='common_opportunity'&&i===0)riskTags.push('결과 불확실');for(const tag of riskTags)if(!d.labels.some(l=>l.text===tag))d.labels.push({text:tag,kind:'risk'});return '<button class="choice" data-choice="'+i+'" '+(c.disabled?.(state)?'disabled':'')+'><span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="choice-content"><strong>'+esc(d.dialogue)+'</strong>'+(d.action===d.dialogue?'':'<span class="choice-action">'+esc(d.action)+'</span>')+'<span class="choice-labels">'+d.labels.map(l=>'<span class="choice-chip '+esc(l.kind)+'">'+esc(l.text)+'</span>').join('')+'</span>'+(d.note?'<small class="choice-note">'+esc(d.note)+'</small>':'')+(c.disabled?.(state)?'<small class="unavailable">현재 현금이 부족해</small>':'')+'</span><span class="arrow" aria-hidden="true">↗</span></button>';}

function stats(){const support=state.day<state.supportEnd?state.support:0;return '<div class="hud"><div class="stat"><small>지금 현금</small><b>'+short(state.cash)+'</b></div><div class="stat"><small>남은 대출</small><b class="debt">'+short(state.debt)+'</b></div><div class="stat"><small>월 근로 / 지원</small><b>'+short(state.salary)+' / '+short(support)+'</b></div><div class="stat"><small>건강 / 멘탈</small><b>'+state.health+' / '+state.mind+'</b></div></div>';}
function lifeSummary(){return '<div class="life-summary"><h3>지금의 생활</h3><div class="life-line"><span>직업</span><b>'+esc(C.jobName(state))+'</b></div><div class="life-line"><span>월세 + 생활비</span><b>'+short(state.rent+state.living)+'</b></div><div class="life-line"><span>업무 경력</span><b>'+state.career+'</b></div><div class="life-line"><span>저장</span><b class="'+(!saveOK?'save-error':'')+'">'+(saveOK?'이 기기에 저장됨':'백업이 필요해')+'</b></div></div>';}

const PERSONALITIES=[['pride','자존심이 센 사람','남에게 아쉬운 소리를 하기 싫다.'],['ambition','욕심이 많은 사람','기회가 보이면 더 큰 몫을 원한다.'],['affection','정이 많은 사람','한번 가까워진 사람을 쉽게 못 끊는다.'],['caution','겁이 많은 사람','문제가 생길 가능성부터 살핀다.'],['adapt','눈치가 빠른 사람','상대의 말투가 바뀌면 바로 알아챈다.']];
function personalitySetup(){app.innerHTML='<section class="landing fade-in"><div class="landing-copy"><div class="eyebrow">CHARACTER SETUP</div><h1 style="font-size:clamp(26px,5vw,44px)">나는 원래 어떤 쪽이었지?</h1><p>교대 기다리는 동안, 별생각이 다 든다.</p><div class="choices">'+PERSONALITIES.map(([id,name,desc])=>'<button class="choice" data-personality="'+id+'"><span class="choice-content"><strong>'+name+'</strong><small>'+desc+'</small></span><span class="arrow">↗</span></button>').join('')+'</div></div></section>';document.querySelectorAll('[data-personality]').forEach(b=>b.onclick=()=>{state.personality=b.dataset.personality;save();render();});}
const THOUGHTS={pride:{o_offer:'말이 쉽지. 내 이름으로 결재 올리는 건데.',n_offer:'돈 받자고 일을 그만두라고?',v_stream:'모르는 사람이 왜 내 시간을 정하지?',v_model:'계약서도 안 주고 오라니.'},ambition:{o_offer:'600만 원이면 몇 달을 당길 수 있지.',n_offer:'월 300이면 더 좋은 조건도 받을 수 있나?',v_stream:'이 사람 하나만 붙잡아도 수입이 달라지겠는데.',v_model:'한 번에 300만 원이라.'},affection:{o_offer:'민서까지 이 일에 엮이면 곤란한데.',n_offer:'소하한테는 뭐라고 말하지?',v_stream:'매일 오는 사람이긴 한데, 선을 넘는 것 같다.',v_model:'실장도 곤란한 사정이 있나?'},caution:{o_offer:'계좌 기록은 남을 텐데.',n_offer:'90일 뒤에는 어떻게 되는 거지?',v_stream:'통화 내용이 녹음되면?',v_model:'사용 범위부터 확인해야겠다.'},adapt:{o_offer:'태준은 왜 꼭 개인 계좌라고 했을까?',n_offer:'저 사람은 돈보다 내 시간을 원하는 것 같은데.',v_stream:'후원자가 요구를 조금씩 늘리고 있다.',v_model:'계약서를 미루는 게 마음에 걸린다.'}};
function personalityThought(){const t=THOUGHTS[state.personality]?.[state.scene];return t?'<div class="personality-thought"><small>속마음</small><p>'+esc(t)+'</p></div>':'';}
const HIDDEN={
 o_offer:{ambition:{text:'“600만 원으로는 부족한데요. 800은 주세요.”',hint:'추가 협상 / 제안 철회 가능',run:s=>{const ok=C.random(s)<.45;C.effect(s,{flags:{rebate:ok,invoiceOpen:ok,hiddenNegotiation:true},relations:{vendor:ok?1:-2},mind:-5});s.flags.negotiatedRebateAmount=ok?8000000:0;s.flags.audit=ok&&C.random(s)<.5;return{text:ok?'태준이 800만 원에 동의했다. 수정 견적을 보냈다.':'태준이 거래를 없던 일로 하자고 했다.',next:'o_paid'};}},caution:{text:'“정상 견적서랑 수정본 둘 다 보내주세요.”',hint:'증빙 확보 / 거래 보류',run:s=>{C.effect(s,{career:8,flags:{records:true,rebate:false,refusedVendor:true}});return{text:'태준이 정상 견적을 다시 보냈다. 두 파일을 모두 저장했다.',next:'o_paid'};}},adapt:{text:'“이 얘기 다른 업체에도 하셨어요?”',hint:'상대 반응 확인 / 거래 보류',run:s=>{C.effect(s,{career:6,flags:{rebate:false,refusedVendor:true,noticedVendor:true}});return{text:'태준은 대답을 피했다. 정상 견적을 다시 요청했다.',next:'o_paid'};}}},
 n_offer:{pride:{text:'“퇴사는 안 해요. 조건 다시 얘기하죠.”',hint:'근무 유지 / 지원 협상 불확실',run:s=>{const ok=C.random(s)<.45;C.effect(s,{support:ok?1000000:0,supportEnd:ok?150:0,flags:{prideNegotiation:true},relations:{doyun:ok?1:-1}});return{text:ok?'도윤은 월 100만 원에 동의했다. 일은 계속하기로 했다.':'도윤은 그 조건이면 어렵다고 했다.',next:'n_conditions'};}},affection:{text:'“소하랑 약속한 날은 빼주세요.”',hint:'약속 유지 / 지원 조건 협상',run:s=>{C.effect(s,{flags:{protectedSoha:true},relations:{soha:2,doyun:-1}});return{text:'도윤은 일단 생각해 보겠다고 했다. 소하에게는 약속을 지키겠다고 보냈다.',next:'n_conditions'};}}},
 v_stream:{caution:{text:'“개인 통화는 녹음 동의부터 받아요.”',hint:'사생활 보호 / 후원 중단 가능',run:s=>{C.effect(s,{career:8,flags:{fanBoundary:true,recordedConsent:true}});return{text:'후원자는 답을 하지 않았다. 방송은 예정대로 켰다.',next:'v_stream2'};}}},
 v_retail:{adapt:{text:'“마감 기록이랑 금고 봉투부터 볼게요.”',hint:'현장 확인 / 정산 오류 추적',run:s=>{C.effect(s,{career:10,flags:{foundEnvelope:true}});return{text:'금고 아래 봉투에서 40만 원을 찾았다. 점장이 마감표를 고쳤다.',next:'v_retail2'};}}},

};
function gameChoices(sc){const base=sc.choices(state),extra=HIDDEN[state.scene]?.[state.personality];return extra?[...base,{...extra,hidden:true}]:base;}

function render(){window.dispatchEvent(new CustomEvent('lhm-review-render',{detail:{scene:state?.scene}}));if(home){landing();return;}if(!state.personality){personalitySetup();return;}if(state.ended){ending();return;}const sc=S[state.scene],choices=gameChoices(sc);app.innerHTML='<div class="game-top"><div><div class="date-label">'+state.date.replaceAll('-','.')+'<small>경과 '+state.day+'일 / 결산까지 '+(C.DAYS-state.day)+'일</small></div><div class="progress"><span style="width:'+state.day/C.DAYS*100+'%"></span></div></div><div class="tools"><button id="finance">돈 관리</button><button id="backlog">지난 이야기</button></div></div>'+stats()+'<div class="game-grid fade-in '+(state.last?'has-result':'no-result')+'"><aside class="visual-column">'+shellPhoto(sc.art,sc.tag)+lifeSummary()+'</aside><section class="result-column" aria-label="선택 결과">'+receipt()+'</section><section class="story-column" aria-label="현재 이야기">'+'<div class="scene-heading"><div class="section-label">'+esc(sc.tag)+'</div><h2 tabindex="-1" id="scene-title">'+esc(val(sc.title,state))+'</h2></div><div class="body-copy">'+val(sc.body,state).map(t=>'<p>'+esc(t)+'</p>').join('')+'</div>'+personalityThought()+chat(sc)+'<div class="choice-label">나라면, 어떻게 할까?</div><div class="choices">'+choices.map((c,i)=>choiceHTML(c,i,sc)).join('')+'</div></section></div>';document.getElementById('finance').onclick=finance;document.getElementById('backlog').onclick=backlog;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));}
function chat(sc){const msgs=sc.chat?sc.chat(state):[];return msgs.length?'<div class="chat"><div class="chat-label">'+esc(val(sc.channel||'메시지 / 대화',state))+'</div>'+msgs.map(m=>'<div class="message"><span class="avatar" aria-hidden="true">'+esc(m.who.slice(0,1))+'</span><div class="msg-content"><small>'+esc(m.who)+'</small><div class="bubble">'+esc(m.text)+'</div></div></div>').join('')+'</div>':'';}
function choose(i){if(busy)return;busy=true;try{state=C.choose(state,{...S,[state.scene]:{...S[state.scene],choices:()=>gameChoices(S[state.scene])}},i);capture(state);save();render();window.scrollTo({top:0,behavior:'instant'});}catch(e){toast('진행을 완료하지 못했어. 현재 화면을 유지할게.');console.error(e);}finally{setTimeout(()=>{busy=false;},300);}}
function ending(){const sc=S.ending;app.innerHTML='<div class="ending-top fade-in"><div><div class="eyebrow">180 DAYS LATER / 이번 인생의 기록</div><h1>'+esc(val(sc.title,state))+'</h1></div><span class="section-label">'+({'office':'사무직에서 시작한 삶','night':'라운지에서 시작한 삶','streamer':'인터넷 방송으로 시작한 삶','retail':'편의점 야간 근무로 시작한 삶','model':'촬영 보조로 시작한 삶'}[state.flags.route]||'이번 인생')+'</span></div><div class="ending-grid"><div>'+shellPhoto(29,'180일 뒤')+'<div class="ending-stats"><div><small>남긴 현금</small><b>'+short(state.cash)+'</b></div><div><small>남은 대출</small><b>'+short(state.debt)+'</b></div><div><small>현재 직업</small><b style="font-size:13px">'+esc(C.jobName(state))+'</b></div><div><small>월 근로 / 지원</small><b style="font-size:13px">'+short(state.salary)+' / '+short(state.day<state.supportEnd?state.support:0)+'</b></div></div><p class="subtle">건강 '+state.health+' / 멘탈 '+state.mind+' / 총 대출 상환 '+short(state.repaid)+'</p>'+(state.flags.unresolvedAudit?'<p class="subtle save-error">별도 반환 요구 : '+short(C.rebateOutstanding(state))+' / 대출 잔액에 미포함</p>':'')+'</div><div><div class="ending-story">'+receipt()+val(sc.body,state).map(t=>'<p>'+esc(t)+'</p>').join('')+'</div><details class="records"><summary>내가 고른 장면들 / '+state.history.length+'번의 선택</summary><ol>'+state.history.map(h=>'<li>'+esc(h.choice)+'</li>').join('')+'</ol></details><div class="modal-actions"><button id="again" class="primary pink">다른 선택으로 살아보기 <span>↗</span></button><button id="ending-backlog" class="secondary">지난 이야기 다시 보기</button><button id="ending-home" class="secondary">시작 화면으로</button></div><p class="subtle">검토용 PLAN-003 / 편의점에서 시작하는 네 갈래.<br>24종 엔딩 등 후속 기획은 아직 구현 전이야.</p></div></div>';document.getElementById('again').onclick=requestNew;document.getElementById('ending-backlog').onclick=backlog;document.getElementById('ending-home').onclick=()=>{home=true;render();window.scrollTo(0,0);};}
function show(content){modal.innerHTML='<div class="close-row"><span class="section-label">LIFE / HARD MODE</span><button id="close-modal" aria-label="닫기">×</button></div>'+content;if(!modal.open)modal.showModal();document.getElementById('close-modal').onclick=()=>modal.close();}
function finance(){if(!state)return;const active=state.day<state.supportEnd?state.support:0;show('<h2>지금 내 돈</h2><div class="finance-list">'+[['현금',won(state.cash)],['남은 대출',won(state.debt)],['월 근로수입',won(state.salary)],['월 지원',won(active)],['월세 + 생활비',won(state.rent+state.living)],['대출 이자','월 1% / 경과 날짜에 따라 계산']].map(([k,v])=>'<div><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</div><p class="subtle">수입과 생활비는 경과 기간에 따라 계산돼. 생활비가 부족하면 부족액이 빚에 더해져.</p><label for="amount">상환할 금액 / 원</label><input id="amount" type="number" inputmode="numeric" min="0" max="'+Math.min(state.cash,state.debt)+'" step="10000" value="'+Math.min(1000000,state.cash,state.debt)+'"><div class="modal-actions"><button class="primary" id="pay" '+(state.ended?'disabled':'')+'>입력한 금액 상환</button><button class="secondary" id="reserve-pay" '+(state.ended?'disabled':'')+'>한 달 생활비를 남기고 상환</button></div><p class="subtle">상환은 날짜를 소모하지 않아. 결산 후에는 변경할 수 없어.</p>');document.getElementById('pay').onclick=()=>{const n=Number(document.getElementById('amount').value);if(!Number.isFinite(n)||n<0||n>Math.min(state.cash,state.debt)){toast('현금과 대출 잔액 안에서 입력해줘.');return;}pay(n);};document.getElementById('reserve-pay').onclick=()=>pay(Math.max(0,state.cash-state.rent-state.living));}
function pay(n){const paid=C.repay(state,n);save();render();finance();toast(won(paid)+' 상환했어.');}
function backlog(){const t=arr(state?.transcript);show('<h2>지난 이야기</h2>'+(t.length?t.map(e=>'<div class="log-item"><small>'+C.dayAfter(C.START,e.day).replaceAll('-','.')+' / '+esc(e.title)+'</small>'+arr(e.body).map(p=>'<p>'+esc(p)+'</p>').join('')+arr(e.chat).map(m=>'<p class="log-dialogue">'+esc(m.who)+' / '+esc(m.text)+'</p>').join('')+(state.history.find(h=>h.scene===e.id)?'<p><b>선택 / '+esc(state.history.find(h=>h.scene===e.id).choice)+'</b></p><p class="log-dialogue">'+esc(state.history.find(h=>h.scene===e.id).result)+'</p>':'')+'</div>').join(''):'<p>아직 시작하지 않았어.</p>'));}

function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const f=input.files[0];if(!f||f.size>2000000)throw Error();const data=JSON.parse(await f.text());if(data.format!=='lhm-v2-first'||!C.valid(data.state,S))throw Error();const incoming=C.migrate(data.state);show('<h2>백업으로 이어갈까?</h2><p>'+esc(incoming.date)+' / '+esc(C.jobName(incoming))+'<br>현재 v2 진행을 이 백업으로 교체해.</p><div class="modal-actions"><button class="primary" id="import-confirm">이 진행 불러오기</button><button class="secondary" id="import-cancel">취소</button></div>');document.getElementById('import-confirm').onclick=()=>{state=incoming;invalidSave=false;capture(state);save();home=false;modal.close();render();};document.getElementById('import-cancel').onclick=()=>modal.close();}catch(e){toast('이 버전의 올바른 백업 파일인지 확인해줘.');}};input.click();}
