<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>QA 카드 13장</title>
<style>html,body{margin:0;background:#2b2b2b;color:#ddd;font:12px sans-serif}
#grid{display:grid;grid-template-columns:repeat(4,300px);gap:10px;padding:10px}
figure{margin:0;background:#eee7d5}img{width:300px;display:block}figcaption{padding:4px 6px;color:#333;font:11px/1.4 sans-serif}
</style></head><body>
<div id="grid"></div>
<iframe id="f" src="./index.html?cards=1" style="width:1px;height:1px;opacity:0;position:absolute;left:-9999px"></iframe>
<script>
const K=[['atm','X 먼저 양보'],['fisher','IV 반응만 확인'],['cat','VII 자존심'],['mirror','IX 누가 더 참았나'],
['fool','XI 답장에 마음'],['cleaner','XXI 거리부터'],['boundary','VIII 다정해도 선'],['unsent','XVIII 마음 방향'],
['knot','XIII 붙잡으면서'],['hourglass','XII 타이밍'],['echo','XIV 말부터 꺼내는'],['openhand','XV 숨김없이 다정'],['nightbus','XVII 피곤해서 문 닫은']];
document.getElementById('f').addEventListener('load',()=>{
  const w=document.getElementById('f').contentWindow;
  const grid=document.getElementById('grid');
  K.forEach(([k,label])=>{
    const svg=w.artSvg(k);
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    const fig=document.createElement('figure');
    fig.innerHTML='<img src="'+url+'"><figcaption>'+label+' · '+k+'</figcaption>';
    grid.appendChild(fig);
  });
  document.title='plates ready';
});
</script></body></html>
