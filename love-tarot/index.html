function radarSvg(an){const ax=an.radar,cx=180,cy=124,R=84;
 const pt=function(i,r){const a=-Math.PI/2+Math.PI*2*i/5;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 const poly=function(ratio){const p=[];for(let i=0;i<5;i++){const q=pt(i,R*ratio);p.push(q[0].toFixed(1)+' '+q[1].toFixed(1))}return p.join(' ')};
 let grid='';
 [1,0.72,0.44,0.16].forEach(function(rr,i){grid+='<polygon points="'+poly(rr)+'" fill="none" stroke="#3a3a34" stroke-width="'+(i===0?'1':'0.7')+'"/>'});
 for(let i=0;i<5;i++){const q=pt(i,R);grid+='<path d="M'+cx+' '+cy+'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" stroke="#33322c" stroke-width="0.8"/>'}
 const pts=ax.map(function(a,i){const q=pt(i,R*a.value/100);return q});
 const shape=pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');
 let labels='';
 ax.forEach(function(a,i){const q=pt(i,R+21);const lx=Math.max(24,Math.min(336,q[0]));const ly=q[1];
  const anchor=Math.abs(lx-cx)<6?'middle':(lx>cx?'start':'end');
  if(i===0){labels+='<text x="'+cx+'" y="14" fill="#c9c4b5" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">'+a.label+'</text>';
   labels+='<text x="'+cx+'" y="26" fill="#d8f983" font-size="10" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">'+a.value+'</text>'}
  else{labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly-1).toFixed(1)+'" fill="#c9c4b5" font-size="9.5" text-anchor="'+anchor+'" font-family="Helvetica,Arial,sans-serif">'+a.label+'</text>';
   labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+11).toFixed(1)+'" fill="#8d897c" font-size="9" text-anchor="'+anchor+'" font-family="Helvetica,Arial,sans-serif">'+a.value+'</text>'}});
 let dots='';
 pts.forEach(function(q){dots+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.8" fill="#d8f983"/>'});
 return '<svg class="ed-radar-svg" viewBox="0 0 360 250" role="img" aria-label="성향 다섯 축">'+
 grid+'<polygon points="'+shape+'" fill="rgba(216,249,131,.14)" stroke="#d8f983" stroke-width="1.3"/>'+dots+labels+'</svg>'}

const PARTNER_TAG={own:['인정','ok'],late:['늦음','mid'],deflect:['변명','bad'],guard:['전가','bad'],ignore:['회피','mid']};
function partnerRead(h,d){
 const rows=[];
 for(let i=0;i<h.length;i++){const e=entryAt(h,i);if(!e)continue;
  const p=isFree(h[i])?(PAT_PREAD[h[i].pat]||PAT_PREAD.short):ROUNDS[i].options[h[i].choice].p;
  rows.push({r:i,title:ROUNDS[i].title,p:p,reply:(e.replies&&e.replies[0])||''})}
 const risk=rows.reduce(function(n,x){return n+(x.p.r||0)},0);
 const own=rows.filter(function(x){return x.p.k==='own'});
 const late=rows.filter(function(x){return x.p.k==='late'});
 const bad=rows.filter(function(x){return x.p.k==='deflect'||x.p.k==='guard'});
 const last=rows[rows.length-1]||null;
 let verdict;
 if(risk>=6)verdict={k:'warn',t:'지금은 너가 접는 쪽으로 굴러가',
  b:(own.length===0?'이번 다섯 번엔 제대로 인정하는 자리가 없었어. 사과가 없는 자리에서 다음에도 접는 건 너야.':'미안하다는 말은 나오는데 그게 늦고, 자꾸 네 반응에 조건이 붙어. 이대로 가면 다음에도 같은 자리에서 접는 건 너야.')};
 else if(risk>=4)verdict={k:'mid',t:'미안한 마음은 있는데, 전달이 어설퍼',b:'잘못한 건 아는데 그걸 너가 먼저 달래줘야 끝나는 구조야. 나쁜 사람이라서가 아니라, 미루는 버릇이 몸에 밴 거야.'};
 else verdict={k:'ok',t:'최소한 자기가 뭘 잘못했는지는 알아',b:'다섯 번 중에 제대로 인정하는 자리가 있었어. 문제는 인정하고 나서 다음에 어떻게 할지를 안 정한다는 거야.'};
 const list=function(a){return a.length?a.slice().sort(function(x,y){return x.r-y.r}).map(function(x){return 'R'+(x.r+1)}).join('·'):'없어'};
 return {rows:rows,risk:risk,own:own,late:late,bad:bad,last:last,verdict:verdict,
  checks:[
   {q:'미안하다는 말이 늦어도 오긴 하니?',ok:(own.length+late.length)>=3,
    d:'인정한 자리: '+list(own.concat(late))+' / 넘어간 자리: '+list(rows.filter(function(x){return x.p.k==='ignore'||x.p.k==='deflect'||x.p.k==='guard'}))},
   {q:'사과 뒤에 변명이 붙니?',ok:bad.length<2,
    d:(bad.length===0&&own.length===0)?'사과도 변명도 없이 그냥 넘어갔어. 이건 변명보다 나쁜 쪽이야.'
     :bad.length===0?'다섯 번 다 변명 없이 자기 몫만 말했어. 이건 쉽지 않은 거야.'
     :(bad.length===1?'한 번('+list(bad)+')만 변명이 섞였어. 나머지는 자기 몫으로 말했고.'
     :'변명이 먼저 나온 자리: '+list(bad)+'. 사과랑 변명이 같이 오면 상대 기억엔 변명만 남아.')},
   {q:'너가 선을 그으면 물러서니?',ok:!!(last&&last.p.k==='own'),
    d:last?(last.p.k==='own'?'마지막 라운드에서 사과를 바로 받아들였어. 이 사람은 적어도 들을 줄은 알아.':'마지막 라운드에서 사과를 받고도 조건을 붙였어. 물러서기보다 계산이 먼저 나온 거야.'):''}]}}

function stratKeyOf(s){for(const k in STRAT){if(STRAT[k]===s)return k}return 'bow'}
function quoteOf(h,d,s){const mm=mismatch(h,d);let r=mm?mm.round:0;
 if(isSilentEntry(h,r)){let alt=-1;for(let i=0;i<h.length;i++){if(!isSilentEntry(h,i)){alt=i;break}}
  if(alt<0)return {round:r,text:'',tail:''};r=alt}
 if(!entryAt(h,r))r=0;
 const e=entryAt(h,r)||{c:''};
 return {round:r,text:e.c,tail:STRAT[stratKeyOf(s)].quoteTail}}
function quote2Of(h,mm){let best=-1,r=0;
 for(let i=0;i<Math.min(h.length,4);i++){const e=entryAt(h,i);if(!e||isSilentEntry(h,i))continue;
  const sc=(e.f.distance||0)*2+(e.f.concede||0)*1.5+(e.f.retaliate||0)+(e.f.indirect||0);
  if(mm&&i===mm.round)continue;
  if(sc>best){best=sc;r=i}}
 if(isSilentEntry(h,r))return {round:r,text:''};
 return {round:r,text:(entryAt(h,r)||{c:''}).c}}
function roundCards(h,d){const out=[];
 for(let i=0;i<h.length;i++){const e=entryAt(h,i);if(!e)continue;
  const m=motiveAt(i,h,d),free=isFree(h[i]);
  const p=free?(PAT_PREAD[h[i].pat]||PAT_PREAD.short):ROUNDS[i].options[h[i].choice].p;
  out.push({title:ROUNDS[i].title,text:e.c,motive:m?m.c:'',intent:e.intent||'',want:p.w,silent:isSilentEntry(h,i),
   reply:(e.replies&&e.replies[0])||'',pat:free?(e.name||''):'',point:free?(e.point||''):'',
   soft:ALT[i].soft,firm:ALT[i].firm,kind:p.k})}
 return out}
