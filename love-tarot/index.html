function radarSvg(an){const ax=an.radar,cx=180,cy=124,R=84;
 const pt=function(i,r){const a=-Math.PI/2+Math.PI*2*i/5;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 const poly=function(ratio){const p=[];for(let i=0;i<5;i++){const q=pt(i,R*ratio);p.push(q[0].toFixed(1)+' '+q[1].toFixed(1))}return p.join(' ')};
 let grid='';
 [1,0.72,0.44,0.16].forEach(function(rr,i){grid+='<polygon points="'+poly(rr)+'" fill="none" stroke="#3a3a34" stroke-width="'+(i===0?'1':'0.7')+'"/>'});
 for(let i=0;i<5;i++){const q=pt(i,R);grid+='<path d="M'+cx+' '+cy+'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)+'" stroke="#33322c" stroke-width="0.8"/>'}
 const pts=ax.map(function(a,i){const q=pt(i,R*a.value/100);return q});
 const shape=pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');
 let labels='';
 ax.forEach(function(a,i){const q=pt(i,R+21);const lx=Math.max(24,Math.min(336,q[0]));const ly=q[1];
  const anchor=Math.abs(lx-cx)<6?'middle':(lx>cx?'start':'end');
  if(i===0){labels+='<text x="'+cx+'" y="14" fill="#c9c4b5" font-size="9.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">'+a.label+'</text>';
   labels+='<text x="'+cx+'" y="26" fill="#d8f983" font-size="10" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">'+a.value+'</text>'}
  else{labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly-1).toFixed(1)+'" fill="#c9c4b5" font-size="9.5" text-anchor="'+anchor+'" font-family="Helvetica,Arial,sans-serif">'+a.label+'</text>';
   labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+11).toFixed(1)+'" fill="#8d897c" font-size="9" text-anchor="'+anchor+'" font-family="Helvetica,Arial,sans-serif">'+a.value+'</text>'}});
 let dots='';
 pts.forEach(function(q){dots+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.8" fill="#d8f983"/>'});
 return '<svg class="ed-radar-svg" viewBox="0 0 360 250" role="img" aria-label="성향 다섯 축">'+
 grid+'<polygon points="'+shape+'" fill="rgba(216,249,131,.14)" stroke="#d8f983" stroke-width="1.3"/>'+dots+labels+'</svg>'}

function copyText(t){if(!t)return;
 const ok=function(){toast('답장 복사됐어요')};
 const old=function(){let ta=null;try{ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
   document.body.appendChild(ta);if(ta.select)ta.select();if(document.execCommand)document.execCommand('copy');return true}
  catch(e){return false}
  finally{try{if(ta&&ta.parentNode&&ta.parentNode.removeChild)ta.parentNode.removeChild(ta)}catch(e){}}};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){if(old())ok();else toast('복사가 안 됐어. 말풍선을 길게 눌러서 복사해 줘.')});return}}
 catch(e){}

/* ---------- story poster: 한 열 에디토리얼 (1080x1920) ---------- */
function wrapWords(ctx,text,max){
 const words=String(text).split(' '),rows=[];let row='';
 words.forEach(function(wd){const test=row?row+' '+wd:wd;
  if(row&&ctx.measureText(test).width>max){rows.push(row);row=wd}else row=test});
 if(row)rows.push(row);
 for(let guard=0;guard<8&&rows.length>1;guard++){
  const last=rows[rows.length-1];
  if(ctx.measureText(last).width>=max*0.46)break;
  const prev=rows[rows.length-2].split(' ');
  if(prev.length<2)break;
  const moved=prev.pop(),cand=moved+' '+last;
  if(ctx.measureText(cand).width>max)break;
  rows[rows.length-2]=prev.join(' ');rows[rows.length-1]=cand}
 return rows}
function fitLines(ctx,text,max,size,min,family){
 let fs=size,lines;
 for(;;){ctx.font=fs+'px '+family;lines=wrapWords(ctx,text,max);if(lines.length<=2||fs<=min)break;fs-=2}
 return {lines:lines,size:fs}}
function blockLines(ctx,text,max,size,min,maxLines,family){
 let fs=size;
 for(;;){ctx.font=fs+'px '+family;const ls=wrapWords(ctx,text,max);
  if(ls.length<=maxLines||fs<=min)return {lines:ls,size:fs};fs-=1}}
function spWidth(ctx,text,sp){const cs=Array.from(String(text));let t=0;
 cs.forEach(function(c,i){t+=ctx.measureText(c).width+(i<cs.length-1?sp:0)});return t}
function spText(ctx,text,px,y,size,sp,family,color,align){
 ctx.font=size+'px '+family;ctx.fillStyle=color;ctx.textAlign='left';
 const cs=Array.from(String(text)),total=spWidth(ctx,text,sp);
 let cur=align==='center'?px-total/2:(align==='right'?px-total:px);
 cs.forEach(function(c){ctx.fillText(c,cur,y);cur+=ctx.measureText(c).width+sp});
 return total}
function drawRadarPoster(ctx,cx,cy,r,axes){
 const pt=function(i,rr){const a=-Math.PI/2+Math.PI*2*i/5;return [cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]};
 [1,0.72,0.44].forEach(function(k,i){ctx.beginPath();
  for(let j=0;j<5;j++){const p=pt(j,r*k);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
  ctx.closePath();ctx.strokeStyle=i?'#cbbda1':'#8d8168';ctx.lineWidth=i?1:1.6;ctx.stroke()});
 for(let j=0;j<5;j++){const p=pt(j,r);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p[0],p[1]);
  ctx.strokeStyle='#d2c5a9';ctx.lineWidth=1;ctx.stroke()}
 ctx.beginPath();axes.forEach(function(a,j){const p=pt(j,r*a.value/100);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});
 ctx.closePath();ctx.fillStyle='rgba(140,45,35,.14)';ctx.fill();ctx.strokeStyle='#8c2d23';ctx.lineWidth=2.4;ctx.stroke();
 axes.forEach(function(a,j){const p=pt(j,r*a.value/100);ctx.beginPath();ctx.arc(p[0],p[1],5,0,Math.PI*2);
  ctx.fillStyle='#8c2d23';ctx.fill()});
 axes.forEach(function(a,j){const p=pt(j,r+34);
  const anchor=Math.abs(p[0]-cx)<12?'center':(p[0]>cx?'left':'right');
  ctx.textAlign=anchor;ctx.fillStyle='#2b261f';ctx.font='23px sans-serif';ctx.fillText(a.label,p[0],p[1]);
  ctx.fillStyle='#8a7c66';ctx.font='19px sans-serif';ctx.fillText(String(a.value),p[0],p[1]+26)});
 ctx.textAlign='center'}
