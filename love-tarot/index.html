function resume(){let ok=false;

  if(v&&Array.isArray(v.history)&&v.history.length<=5&&v.history.every(function(a){return a&&((Number.isInteger(a.choice)&&a.choice>=0&&a.choice<4)||(a.choice===null&&typeof a.text==='string'&&a.text.length>0&&a.text.length<=120&&PAT[a.pat]))})&&['intro','play','motive','reaction','result'].indexOf(v.phase)>=0){
   state={phase:v.phase,history:[],desires:{0:null,2:null},demoUnlocked:v.demoUnlocked===true,freeOpen:false};
   v.history.forEach(function(a){if(Number.isInteger(a.choice)){const sc=scene(state.history);state.history.push({choice:a.choice,text:sc.options[a.choice].c})}
    else state.history.push({choice:null,text:a.text,pat:a.pat,pat2:(a.pat2&&PAT[a.pat2])?a.pat2:null})});
   [0,2].forEach(function(r){if(Number.isInteger(v.desires&&v.desires[r])&&v.desires[r]>=0&&v.desires[r]<4)state.desires[r]=v.desires[r]});
   ok=true}}catch(e){state=fresh()}
 if(!ok)state=fresh();
 if(state.phase==='reaction'&&state.history.length)reaction();
 else if(state.phase==='motive'||state.phase==='play'||state.phase==='result')advance();
 else intro()}
