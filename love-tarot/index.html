function partnerRead(h,d){
 const rows=[];
 for(let i=0;i<h.length;i++){const e=entryAt(h,i);if(!e)continue;
  const p=isFree(h[i])?(PAT_PREAD[h[i].pat]||PAT_PREAD.short):ROUNDS[i].options[h[i].choice].p;
  rows.push({r:i,title:ROUNDS[i].title,p:p,reply:(e.replies&&e.replies[0])||''})}
 const risk=rows.reduce(function(n,x){return n+(x.p.r||0)},0);
 const own=rows.filter(function(x){return x.p.k==='own'});
 const late=rows.filter(function(x){return x.p.k==='late'});
 const bad=rows.filter(function(x){return x.p.k==='deflect'||x.p.k==='guard'});
 const last=rows[rows.length-1]||null;
 let verdict;
 if(risk>=6)verdict={k:'warn',t:'지금은 너가 접는 쪽으로 굴러가',
  b:(own.length===0?'이번 다섯 번엔 제대로 인정하는 자리가 없었어. 사과가 없는 자리에서 다음에도 접는 건 너야.':'미안하다는 말은 나오는데 그게 늦고, 자꾸 네 반응에 조건이 붙어. 이대로 가면 다음에도 같은 자리에서 접는 건 너야.')};
 else if(risk>=4)verdict={k:'mid',t:'미안한 마음은 있는데, 전달이 어설퍼',b:'잘못한 건 아는데 그걸 너가 먼저 달래줘야 끝나는 구조야. 나쁜 사람이라서가 아니라, 미루는 버릇이 몸에 밴 거야.'};
 else verdict={k:'ok',t:'최소한 자기가 뭘 잘못했는지는 알아',b:'다섯 번 중에 제대로 인정하는 자리가 있었어. 문제는 인정하고 나서 다음에 어떻게 할지를 안 정한다는 거야.'};
 const list=function(a){return a.length?a.slice().sort(function(x,y){return x.r-y.r}).map(function(x){return 'R'+(x.r+1)}).join('·'):'없어'};
 return {rows:rows,risk:risk,own:own,late:late,bad:bad,last:last,verdict:verdict,
  checks:[
   {q:'미안하다는 말이 늦어도 오긴 하니?',ok:(own.length+late.length)>=3,
    d:'인정한 자리: '+list(own.concat(late))+' / 넘어간 자리: '+list(rows.filter(function(x){return x.p.k==='ignore'||x.p.k==='deflect'||x.p.k==='guard'}))},
   {q:'사과 뒤에 변명이 붙니?',ok:bad.length<2,
    d:(bad.length===0&&own.length===0)?'사과도 변명도 없이 그냥 넘어갔어. 이건 변명보다 나쁜 쪽이야.'

     :(bad.length===1?'한 번('+list(bad)+')만 변명이 섞였어. 나머지는 자기 몫으로 말했고.'
     :'변명이 먼저 나온 자리: '+list(bad)+'. 사과랑 변명이 같이 오면 상대 기억엔 변명만 남아.')},
   {q:'너가 선을 그으면 물러서니?',ok:!!(last&&last.p.k==='own'),
    d:last?(last.p.k==='own'?'마지막 라운드에서 사과를 바로 받아들였어. 이 사람은 적어도 들을 줄은 알아.':'마지막 라운드에서 사과를 받고도 조건을 붙였어. 물러서기보다 계산이 먼저 나온 거야.'):''}]}}

/* ===== v4.2: 결과 코드 (LT4-…) + 둘의 궁합 리포트 =====
   서버 없이 동작해야 해서, 코드에는 계산이 끝난 값만 담는다.
   9바이트(맨 끝 1바이트는 체크섬) → base32 15자 → LT4-XXXXX-XXXXX-XXXXX */
const CODE32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const CODE_VER=2, CODE_LEN=15;
const STRATKEYS=['bow','late','alone','turn','test','blunt','clip','wave','press','hold'];
const QUAD_KEYS=['secure','anxious','avoidant','mixed'];
const AXIS_LABELS=['눈치','직진','회피','체면','선 긋기'];
function quant(v){return Math.max(0,Math.min(63,Math.round((Number(v)||0)/100*63)))}
function dequant(q){return clamp100(q/63*100)}
function bytesToCode(bytes){
 let bits='';bytes.forEach(function(b){bits+=('00000000'+b.toString(2)).slice(-8)});
 while(bits.length%5)bits+='0';
 let s='';for(let i=0;i<bits.length;i+=5)s+=CODE32.charAt(parseInt(bits.slice(i,i+5),2));
 return 'LT4-'+s.slice(0,5)+'-'+s.slice(5,10)+'-'+s.slice(10,15)}
function codeOf(an){
 const bits=[];const put=function(v,n){bits.push({v:Math.max(0,Math.min(Math.pow(2,n)-1,Math.round(v))),n:n})};
 put(CODE_VER,3);put(Math.max(0,QUAD_KEYS.indexOf(an.quadrant)),2);
 put(Math.max(0,STRATKEYS.indexOf(stratKeyOf(an.strategy))),4);
 (an.radar||[]).slice(0,5).forEach(function(a){put(quant(a.value),6)});
 while((an.radar||[]).length<5)put(0,6);
 put(quant(an.features?an.features.concede:an.metrics[0].value),6);
 put(quant(an.anxiety),6);put(quant(an.avoidance),6);
 put(an.stay?(an.stay.i+1):0,3);
 let s='';bits.forEach(function(b){s+=('0000000000000000'+b.v.toString(2)).slice(-b.n)});
 while(s.length%8)s+='0';
 const bytes=[];for(let i=0;i<s.length;i+=8)bytes.push(parseInt(s.slice(i,i+8),2));
 let sum=0;bytes.forEach(function(b){sum=(sum+b)&255});bytes.push(sum);
 return bytesToCode(bytes)}
function codeParse(raw){
 const src=String(raw==null?'':raw).trim();
 if(!src)return {ok:false,err:'empty'};
 const up=src.toUpperCase().replace(/\s/g,'');
 if(up.indexOf('LT4')!==0)return {ok:false,err:'prefix'};
 let body=up.slice(3).replace(/[-_]/g,'');
 if(body.length!==CODE_LEN)return {ok:false,err:'length'};
 body=body.replace(/[IL]/g,'1').replace(/O/g,'0');
 let bits='';
 for(let i=0;i<body.length;i++){const v=CODE32.indexOf(body.charAt(i));if(v<0)return {ok:false,err:'char'};bits+=('00000'+v.toString(2)).slice(-5)}
 const bytes=[];for(let i=0;i<72;i+=8)bytes.push(parseInt(bits.slice(i,i+8),2));
 let sum=0;for(let i=0;i<8;i++)sum=(sum+bytes[i])&255;
 if(sum!==bytes[8])return {ok:false,err:'checksum'};
 let pos=0;const take=function(n){const v=parseInt(bits.slice(pos,pos+n),2);pos+=n;return v};
 const ver=take(3);if(ver!==CODE_VER)return {ok:false,err:'version'};
 const q=take(2),sk=take(4);
 if(q>=QUAD_KEYS.length||sk>=STRATKEYS.length)return {ok:false,err:'range'};
 const radar=AXIS_LABELS.map(function(L){return {k:L,label:L,value:dequant(take(6))}});
 const eul=dequant(take(6)),anxiety=dequant(take(6)),avoidance=dequant(take(6)),st=take(3);
 if(st>4)return {ok:false,err:'range'};
 return {ok:true,code:bytesToCode(bytes),quadrant:QUAD_KEYS[q],type:QUAD_TYPES[QUAD_KEYS[q]][0],tag:QUAD_TYPES[QUAD_KEYS[q]][1],
  strategyKey:STRATKEYS[sk],strategyTitle:STRAT[STRATKEYS[sk]].title,radar:radar,eul:eul,anxiety:anxiety,avoidance:avoidance,
  stay:st?st-1:null,stayTag:st?STAY[st-1].tag:'',sameAsMine:false}}
function codeErrorText(err){
 const m={
  empty:'상대 코드를 아직 안 넣었어. 상대도 이 화면에서 “내 결과 코드”를 복사해서 보내주면 돼!',
  prefix:'코드 앞이 LT4가 아니야. 결과 화면에서 복사한 그대로 넣어줘!',
  length:'코드가 15자리가 아니야. 중간에 빠진 글자가 없는지 봐줘.',
  char:'코드에 못 읽는 글자가 섞였어. 복사한 그대로 다시 붙여줘!',
  checksum:'코드가 중간에 한 글자 틀어진 것 같아. 복사한 그대로 다시 붙여줘!',
  version:'이 코드는 지난 버전이야. 상대한테 새 버전에서 코드를 다시 받아줘.',
  range:'코드는 맞는데 내용이 비어 있어. 상대한테 다시 복사해 달라고 해줘!',
  self:'이건 내 코드야! 상대방 코드를 넣어줘.'};
 return m[err]||'코드를 읽지 못했어. 복사한 그대로 다시 붙여줘!'}
const QPAIR={

const SAME_STRAT={

function compatOf(mine,other){
 if(!mine||!other)return null;
 const pair=QPAIR[mine.quadrant+'+'+other.quadrant]||QPAIR['secure+secure'];
 const myEul=Math.round(mine.features?mine.features.concede:mine.metrics[0].value),otEul=other.eul;
 const gap=Math.abs(myEul-otEul);
 const frictions=[];
 if(gap>=25)frictions.push({k:'을 지수 '+myEul+' vs '+otEul,w:'한쪽은 접고 한쪽은 요구해. 접는 쪽이 먼저 지쳐서, 어느 날 갑자기 “이제 그만”으로 나와!'});
 else if(gap>=10)frictions.push({k:'을 지수 '+myEul+' vs '+otEul,w:'한쪽이 조금 더 접어. 그 조금이 쌓이면 “나만 맞추잖아”가 먼저 나와.'});
 else frictions.push({k:'을 지수 '+myEul+' vs '+otEul,w:'둘 다 비슷하게 접고 비슷하게 요구해. 세기는 맞는데, 둘 다 참고 있으면 같이 터져!'});
 const AX=[['회피','너는 말 줄이고 닫는데, 상대는 그걸 포기로 읽고 더 붙잡아!','상대는 닫는데, 너는 그걸 포기로 읽고 더 붙잡아!'],
  ['직진','너는 그 자리에서 말하는데, 상대는 돌려 말해서 결론이 안 나와!','상대는 그 자리에서 말하는데, 너는 돌려 말해서 결론이 안 나와!'],
  ['눈치','너는 기분부터 읽는데, 상대는 말한 것만 봐. 그래서 너가 먼저 지쳐!','상대는 기분부터 읽는데, 너는 말한 것만 봐. 그래서 상대가 먼저 지쳐!'],
  ['체면','너는 농담으로 넘기는데, 상대는 그 말을 그대로 받아!','상대는 농담으로 넘기는데, 너는 그 말을 그대로 받아!'],
  ['선 긋기','너는 선을 먼저 긋는데, 상대는 그 선을 못 보고 넘어와!','상대는 선을 먼저 긋는데, 너는 그 선을 못 보고 넘어와!']];
 const axisCand=[];
 AX.forEach(function(row){
  const m=axisVal(mine.radar,row[0]),o=axisVal(other.radar,row[0]),d=Math.abs(m-o);
  if(d<18)return;
  axisCand.push({d:d,item:{k:row[0]+' '+m+' vs '+o,w:(m>o?row[1]:row[2])}})});
 axisCand.sort(function(a,b){return b.d-a.d});
 axisCand.slice(0,2).forEach(function(x){frictions.push(x.item)});
 /* 같은 전략끼리도 “멈춘다”로만 나오면 직진형끼리 만날 때 말이 안 맞아서 SAME_STRAT로 나눈다 */
 if(mine.strategy&&other.strategyKey){
  const sk=stratKeyOf(mine.strategy);
  if(sk===other.strategyKey)frictions.push({k:'같은 방식',w:'둘 다 “'+mine.strategy.title+'”. '+(SAME_STRAT[sk]||'그래서 싸우면 둘 다 같은 데서 멈춰서, 먼저 말을 꺼내는 사람이 없어!')});
  else frictions.push({k:mine.strategy.title+' vs '+other.strategyTitle,w:'너는 이 방식으로 말하고 상대는 저 방식으로 받아. 둘 다 말은 하고 있는데, 순서가 안 맞아서 같은 얘기를 두 번 해!'});
 }
 const same=[],diff=[];
 (mine.radar||[]).forEach(function(a){
  const o=axisVal(other.radar,a.label),d=Math.abs(a.value-o);

 return {pair:pair,myType:mine.type,otherType:other.type,myQuad:mine.quadrant,otherQuad:other.quadrant,
  myEul:myEul,otherEul:otEul,eulGap:gap,eulGapBig:gap>=25,
  frictions:frictions,same:same,diff:diff,myStay:mine.stay?mine.stay.tag:'',otherStay:other.stayTag||'',
  myStrategy:mine.strategy.title,otherStrategy:other.strategyTitle}
}

function stratKeyOf(s){for(const k in STRAT){if(STRAT[k]===s)return k}return 'bow'}
function quoteOf(h,d,s){const mm=mismatch(h,d);let r=mm?mm.round:0;
 if(isSilentEntry(h,r)){let alt=-1;for(let i=0;i<h.length;i++){if(!isSilentEntry(h,i)){alt=i;break}}
  if(alt<0)return {round:r,text:'',tail:''};r=alt}
 if(!entryAt(h,r))r=0;
 const e=entryAt(h,r)||{c:''};
 return {round:r,text:e.c,tail:STRAT[stratKeyOf(s)].quoteTail}}
function quote2Of(h,mm){let best=-1,r=0;
 for(let i=0;i<Math.min(h.length,4);i++){const e=entryAt(h,i);if(!e||isSilentEntry(h,i))continue;
  const sc=(e.f.distance||0)*2+(e.f.concede||0)*1.5+(e.f.retaliate||0)+(e.f.indirect||0);
  if(mm&&i===mm.round)continue;
  if(sc>best){best=sc;r=i}}
 if(isSilentEntry(h,r))return {round:r,text:''};
 return {round:r,text:(entryAt(h,r)||{c:''}).c}}
function roundCards(h,d){const out=[];
 for(let i=0;i<h.length;i++){const e=entryAt(h,i);if(!e)continue;
  const m=motiveAt(i,h,d),free=isFree(h[i]);
  const p=free?(PAT_PREAD[h[i].pat]||PAT_PREAD.short):ROUNDS[i].options[h[i].choice].p;
  out.push({title:ROUNDS[i].title,text:e.c,motive:m?m.c:'',intent:e.intent||'',want:p.w,silent:isSilentEntry(h,i),
   reply:(e.replies&&e.replies[0])||'',pat:free?(e.name||''):'',point:free?(e.point||''):'',
   soft:ALT[i].soft,firm:ALT[i].firm,kind:p.k})}
 return out}

function resume(){let ok=false;
 try{const v=JSON.parse(localStorage.getItem(KEY));
  if(v&&Array.isArray(v.history)&&v.history.length<=5&&v.history.every(function(a,i){return a&&((Number.isInteger(a.choice)&&a.choice>=0&&a.choice<ROUNDS[i].options.length)||(a.choice===null&&typeof a.text==='string'&&a.text.length>0&&a.text.length<=120&&PAT[a.pat]))})&&['intro','play','motive','reaction','verdict','result'].indexOf(v.phase)>=0){
   const pk=(typeof v.partner==='string'&&v.partner)?codeParse(v.partner):{ok:false};
   state={phase:v.phase,history:[],desires:{0:null,1:null,2:null,3:null},demoUnlocked:v.demoUnlocked===true,freeOpen:false,stay:(Number.isInteger(v.stay)&&v.stay>=0&&v.stay<4)?v.stay:null,partner:pk.ok?pk.code:''};
   v.history.forEach(function(a){if(Number.isInteger(a.choice)){const sc=scene(state.history);state.history.push({choice:a.choice,text:sc.options[a.choice].c})}
    else state.history.push({choice:null,text:a.text,pat:a.pat,pat2:(a.pat2&&PAT[a.pat2])?a.pat2:null})});
   MOTIVE_ROUNDS.forEach(function(r){if(Number.isInteger(v.desires&&v.desires[r])&&v.desires[r]>=0&&v.desires[r]<4)state.desires[r]=v.desires[r]});
   ok=true}}catch(e){state=fresh()}
 if(!ok)state=fresh();
 if(state.phase==='reaction'&&state.history.length)reaction();
 else if(state.phase==='motive'||state.phase==='play'||state.phase==='verdict'||state.phase==='result')advance();
 else intro()}
