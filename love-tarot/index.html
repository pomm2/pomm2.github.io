.ed-figure{margin:0}
.ed-tarot{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#eee7d5;border:1px solid #2a2822}
.ed-figure figcaption{font-size:7px;letter-spacing:1.1px;color:#7f7a6c;margin-top:9px;line-height:1.7}
.ed-index{padding-top:2px}
.ed-index-kicker{font-size:8px;letter-spacing:1.5px;color:#8b8577;margin:0 0 10px}
.ed-index-row{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.ed-index-row span{font-size:11px;color:#a8a294;white-space:nowrap}
.ed-index-row i{flex:1;height:1px;background:#33322c;opacity:.7}
.ed-index-row b{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:-.5px;line-height:1}
.ed-index-type{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-top:2px}
.ed-index-type span{display:block;font-size:7.5px;letter-spacing:1.5px;color:#7f7a6c}
.ed-index-type b{font-family:var(--serif);font-size:18px;font-weight:400;display:block;margin:3px 0 2px;line-height:1.3}
.ed-index-type i{font-style:normal;font-size:10px;color:#a8a294;line-height:1.65;display:block}
.ed-index-note{font-size:8px;color:#6f6a5e;line-height:1.7;margin:11px 0 0}
.ed-sec{padding:30px 0;border-bottom:1px solid var(--line)}
.ed-num{font-size:8.5px;letter-spacing:1.7px;color:#7f7a6c;margin:0 0 13px;display:flex;gap:9px;align-items:baseline}
.ed-num b{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--lime);letter-spacing:0;line-height:1}
.ed-sec h2{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.5;letter-spacing:-.4px;margin:0 0 16px}
.ed-h2sub{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0 0 10px;color:#f0ead9}
.ed-h3{font-size:9px;letter-spacing:1.5px;color:#8b8577;margin:26px 0 12px;font-weight:400}
.ed-body{font-size:13px;line-height:2.02;color:#cbc5b6;margin:0 0 11px}
.ed-note{font-size:9px;line-height:1.85;color:#7d786a;margin:14px 0 0}
.ed-lede{font-size:8.5px;letter-spacing:1.1px;color:#8b8577;margin:-10px 0 18px}
.hl, mark{background-color:transparent}
.hl{color:#f6f7ea;background-image:linear-gradient(180deg,transparent 53%,rgba(216,249,131,.32) 53%,rgba(216,249,131,.32) 94%,transparent 94%);background-repeat:no-repeat;background-size:100% 100%;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:markSweep .8s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes markSweep{from{background-size:0% 100%}to{background-size:100% 100%}}
.ed-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px;align-items:start}
.ed-pair-label{display:block;font-size:7.5px;letter-spacing:1.2px;color:#8b8577;margin-bottom:8px}
.ed-bubble{font-size:12px;line-height:1.8;padding:12px 13px;border-radius:2px 12px 12px 12px;overflow-wrap:anywhere}
.ed-bubble.sent{background:#d8f983;color:#1c2618}
.ed-bubble.wanted{background:transparent;color:#b9b3a4;border:1px dashed #6d6a5c}
.ed-bubble.small{max-width:100%;margin:0 0 6px}
.ed-alt{display:flex;flex-direction:column;align-items:flex-end;gap:0;margin:0}
.ed-alt-label{align-self:flex-start;font-size:7.5px;letter-spacing:1.2px;color:#8b8577;margin:16px 0 8px}
.ed-alt .ed-bubble{max-width:88%}
.ed-bubble.alt-soft{background:#141811;color:#dbe5c8;border:1px solid #46573f}
.ed-bubble.alt-firm{background:#1a1210;color:#ecd6cb;border:1px solid #6b3d37}
.ed-bubble-tag{display:block;margin-top:9px;font-size:7.5px;letter-spacing:1.2px;color:#8b8577}
.ed-quad-wrap{border:1px solid var(--line);padding:16px 12px 6px;background:#0a0c0d}
.ed-quad-svg{display:block;width:100%;height:auto}
.ed-quad-meta{display:flex;gap:10px;align-items:baseline;margin-top:14px;flex-wrap:wrap}
.ed-quad-meta b{font-family:var(--serif);font-size:17px;font-weight:400}
.ed-quad-meta span{font-size:10.5px;color:#a8a294;line-height:1.7}
.ed-table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:12px;table-layout:fixed}
.ed-table th{width:35%;text-align:left;vertical-align:top;font-weight:400;color:#8b8577;font-size:9px;letter-spacing:.4px;padding:12px 10px 12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);line-height:1.7}
.ed-table td{padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#e0d9c9;line-height:1.85}
.ed-pred{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.ed-pred span{font-family:var(--serif);font-size:12px;color:var(--lime);line-height:1.6}
.ed-pred h3{font-size:12px;margin:0 0 5px;font-weight:500;color:#e4dece;line-height:1.6}
.ed-pred p{font-size:12px;line-height:1.95;color:#b9b3a4;margin:0}
.ed-lock{margin:24px 0;padding:26px 18px;border:1px dashed #55523f;text-align:center;background:#101211}
.ed-lock-k{font-size:8px;letter-spacing:1.8px;color:#8b8577;margin:0 0 10px}
.ed-lock h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:0 0 14px}
.ed-lock ul{list-style:none;padding:0;margin:0 0 20px;font-size:11px;color:#a8a294;line-height:2.05}
.ed-unlock{width:100%;background:#d8f983;color:#1b2417;border:0;padding:14px;font-size:11.5px;font-weight:600;letter-spacing:-.2px;border-radius:0}
.ed-testnote{font-size:8px;color:#6f6a5e;margin:10px 0 0}
.ed-chat{border:1px solid var(--line);margin:0 0 14px;background:#0a0c0d}
.ed-chat-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.ed-chat-head b{font-size:11px;font-weight:500;color:#e4dece}
.ed-chat-head small{font-size:8px;color:#7f7a6c;letter-spacing:.5px;white-space:nowrap}
.ed-chat-row{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:11px 13px;border-bottom:1px solid #1c1e1b}
.ed-chat-row:last-child{border-bottom:0}
.ed-chat-row b{font-size:9px;color:#8b8577;font-weight:400;padding-top:4px}
.ed-chat-row p{margin:0;font-size:11.5px;line-height:1.85;color:#cbc5b6}
.ed-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed-btn{border:1px solid #4a4740;background:transparent;color:#ded8c8;padding:13px 8px;font-size:10px;letter-spacing:.2px;border-radius:0}
.ed-share{width:100%;margin:8px 0 0;background:#d8f983;color:#1b2417;border:0;padding:14px;font-size:11.5px;font-weight:600}
.ed-tail{display:flex;gap:20px;justify-content:center;margin:24px 0 0;flex-wrap:wrap}
.ed-link{background:none;border:0;color:#8b8577;font-size:9.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
.ed-foot{font-size:7.5px;line-height:1.95;color:#5f5b50;margin:26px 0 0;letter-spacing:-.1px}
/* ---- v3.4: free/paid boundary, headline, card actions, copy ---- */
.ed-cut{display:flex;align-items:center;gap:12px;margin:32px 0 0}
.ed-cut:before,.ed-cut:after{content:"";flex:1;height:1px;background:#4a473c}
.ed-cut-k{font-size:7.5px;letter-spacing:1.7px;color:#8b8577;white-space:nowrap}
.ed-paybadge{display:block;margin:12px 0 0;padding:12px 10px;text-align:center;font-size:11.5px;font-weight:600;letter-spacing:-.2px;border-radius:0}
.ed-paybadge.locked{background:#d8f983;color:#1b2417}
.ed-paybadge.unlocked{background:#101408;color:#d8f983;border:1px dashed #6c7d43;font-weight:500;letter-spacing:.2px}
.ed-pay{margin:30px 0 6px}
.ed-payblur{display:flex;flex-direction:column;gap:10px;margin:12px 0;padding:15px 14px;border:1px dashed #3b3a30;background:#0a0c0d;filter:blur(4.5px);opacity:.6;user-select:none;pointer-events:none}
.ed-payblur span{font-size:11px;line-height:1.7;color:#cfcabb}
.ed-paybox{border:1px solid #3a3a30;background:#0f110f;padding:16px 14px 14px;text-align:center}
.ed-paybox .ed-unlock{margin:12px 0 0}
.ed-paybox .ed-testnote{margin:10px 0 0}
.ed-altrow{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:0 0 12px}
.ed-copy{align-self:flex-end;border:1px solid #4a4740;background:transparent;color:#cfc9b8;font-size:9px;letter-spacing:-.1px;padding:7px 11px;border-radius:0}
.ed-copy:active{background:#1b2016;border-color:#d8f983;color:#eef3df}
.ed-h3-tip{font-size:8px;letter-spacing:0;color:#6f6a5e;margin-left:6px}
.ed-cardact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.ed-cardbtn{border:1px solid #5a6b3c;background:#151a12;color:#dce8c2;font-size:9px;padding:9px 3px;border-radius:0;letter-spacing:-.3px;line-height:1.3}
.ed-cardbtn:active{background:#232c1a;border-color:#d8f983}
.ed-lead{margin:24px 0 0;padding:20px 0 24px;border-bottom:1px solid var(--line)}
.ed-lead-k{font-size:7.5px;letter-spacing:1.6px;color:#8b8577;margin:0 0 10px}
.ed-lead-h{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.52;letter-spacing:-.6px;margin:0;color:#f3edda}
@media(max-width:390px){.ed{padding:0 17px 60px}.ed-hero{grid-template-columns:1.02fr .98fr;gap:14px}.ed-title{font-size:27px}.ed-pair{gap:7px}.ed-bubble{font-size:10.5px;line-height:1.75;padding:10px 10px}.ed-pair-label{font-size:7px}.ed-index-row b{font-size:19px}.ed-index-type b{font-size:17px}.ed-lead-h{font-size:22px}.ed-cardbtn{font-size:8px;padding:8px 2px}.ed-paybadge{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){.hl, mark{background-color:transparent}
.hl{animation:none;background-size:100% 100%}}
