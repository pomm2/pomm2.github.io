.ed-check{margin:0 0 6px;border-top:1px solid var(--line)}
.ed-check-row{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:12px 0;border-bottom:1px solid #1e201c}
.ed-check-row>span{width:18px;height:18px;display:grid;place-items:center;font-size:10px;border:1px solid #4a4740;color:#a8a294;margin-top:2px}
.ed-check-row.ok>span{border-color:#54683c;color:#d8f983}
.ed-check-row.warn>span{border-color:#7a4038;color:#e2a596}
.ed-check-row b{display:block;font-size:11.5px;font-weight:500;color:#e4dece;line-height:1.6}
.ed-check-row p{margin:3px 0 0;font-size:11.5px;line-height:1.85;color:#b0aa9c}
.ed-verdict{margin:18px 0 14px;padding:16px;border:1px solid #3a3a30;background:#0f110f}
.ed-verdict span{display:block;font-size:7.5px;letter-spacing:1.5px;color:#8b8577;margin:0 0 8px}
.ed-verdict b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;line-height:1.5;letter-spacing:-.4px;color:#f0ead9}
.ed-verdict p{margin:8px 0 0;font-size:12px;line-height:1.95;color:#b6b0a1}
.ed-verdict.ok{border-color:#4d5f39}.ed-verdict.ok b{color:#d8f983}
.ed-verdict.warn{border-color:#6b3d37}.ed-verdict.warn b{color:#e6a898}
.ed-rcard{margin:0 0 18px;padding:15px 14px 13px;border:1px solid #2b2c25;background:#0a0c0d}
.ed-rcard-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 11px}
.ed-rcard-h span{font-size:7.5px;letter-spacing:1.4px;color:#7f9a54}
.ed-rcard-h b{font-size:11.5px;font-weight:500;color:#e4dece}
.ed-rcard-h em{font-style:normal;font-size:7.5px;letter-spacing:.3px;padding:2px 6px;border:1px solid #4d5a3a;color:#cfe0a9}
.ed-rcard .ed-bubble.sent{max-width:100%;margin:0 0 11px}
.ed-rmeta{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:7px 0;border-top:1px solid #1b1d19}
.ed-rmeta span{font-size:8px;letter-spacing:.6px;color:#8b8577;padding-top:3px}
.ed-rmeta p{margin:0;font-size:11.5px;line-height:1.8;color:#c6c0b1;overflow-wrap:anywhere}
.ed-rreply{margin:9px 0 0;font-size:11px;line-height:1.8;color:#9e9889;padding-left:9px;border-left:1px solid #33322c;overflow-wrap:anywhere}
.ed-rpoint{margin:9px 0 0;font-size:11px;line-height:1.85;color:#d3ccb9}
.ed-rpoint b{color:#d8f983;font-weight:500;font-size:8px;letter-spacing:1.1px;margin-right:6px}
.ed-pack{margin:12px 0 0;border-top:1px dashed #3b3a30;padding-top:11px}
.ed-pack-row{display:grid;grid-template-columns:1fr auto;gap:4px 9px;align-items:start;padding:9px 0;border-bottom:1px solid #1b1d19}
.ed-pack-row:last-child{border-bottom:0}
.ed-pack-k{grid-column:1 / -1;font-size:7.5px;letter-spacing:1.2px;color:#8b8577}
.ed-pack-row p{margin:0;font-size:11.5px;line-height:1.8;color:#ded8c8;overflow-wrap:anywhere}
.ed-pack-row .ed-copy{align-self:start}
.ed-fork{margin:0 0 14px;padding:14px 15px;border:1px solid #2b2c25;background:#0a0c0d}
.ed-fork.cut{border-color:#46573f;background:#0b0f0a}
.ed-fork-h{display:flex;align-items:baseline;gap:9px;margin:0 0 10px}
.ed-fork-h span{font-family:var(--serif);font-size:13px;color:#7f9a54}
.ed-fork-h b{font-family:var(--serif);font-size:16px;font-weight:400;color:#efe9d8;letter-spacing:-.3px}
.ed-fork-step{display:grid;grid-template-columns:44px 1fr;gap:9px;padding:8px 0;border-top:1px solid #1b1d19}
.ed-fork-step span{font-size:8px;letter-spacing:.4px;color:#8b8577;padding-top:3px}
.ed-fork-step p{margin:0;font-size:11.5px;line-height:1.85;color:#bdb7a8}
.ed-fork.cut .ed-fork-step p{color:#cfd6bd}
.ed-blind{margin:0 0 4px;padding:14px 15px;border:1px dashed #4b4a3c;background:#0a0c0d}
.ed-blind-row{display:flex;align-items:baseline;gap:9px;margin:0 0 8px;flex-wrap:wrap}
.ed-blind-row span{font-size:7.5px;letter-spacing:1.2px;color:#8b8577}
.ed-blind-row b{font-family:var(--serif);font-size:16px;font-weight:400;color:#e9e2cf;letter-spacing:-.3px}
.ed-quick{margin:0;padding:4px 14px;border:1px solid #2b2c25;background:#0a0c0d}
@media(max-width:390px){.ed-quote-t{font-size:14px}.ed-verdict b{font-size:16px}.ed-fork-h b{font-size:15px}.ed-prow{grid-template-columns:22px 1fr auto;gap:7px}.ed-rmeta{grid-template-columns:40px 1fr}.ed-pack-row p{font-size:11px}}

/* ---- v4.1: 마지막 판정 화면 (카톡방 아님 · 밤에 혼자 앉은 타로 테이블) ---- */
body[data-phase="verdict"]{background:#08090a}
body[data-phase="verdict"] #app{background:#08090a;max-width:460px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.vd{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding:24px 20px calc(18px + env(safe-area-inset-bottom));
 background:radial-gradient(125% 70% at 50% -6%,#1d1e18 0%,#0d0e0b 52%,#08090a 100%);color:#e9e5d9;
 font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;word-break:keep-all}
.vd-glow{position:absolute;left:18%;right:18%;top:-14%;height:38%;background:radial-gradient(50% 60% at 50% 50%,rgba(216,249,131,.13),rgba(216,249,131,0) 72%);pointer-events:none}
.vd-top{position:relative;display:flex;justify-content:space-between;gap:10px;font-size:7.5px;letter-spacing:1.7px;color:#7f7a6c;border-bottom:1px solid #2a2b24;padding-bottom:10px}
.vd-k{position:relative;margin:24px 0 0;font-size:8.5px;letter-spacing:1.9px;color:#9a9486}
.vd-q{position:relative;margin:13px 0 0;font-family:'LoveSerif','Noto Serif KR','Nanum Myeongjo',serif;font-weight:400;font-size:25px;line-height:1.5;letter-spacing:-.7px;color:#f2ecda}
.vd-sub{position:relative;margin:14px 0 0;font-size:13.5px;line-height:1.9;color:#c6c0b1}
.vd-opts{position:relative;margin:24px 0 0;display:grid;gap:8px}
.vd-opt{display:flex;gap:11px;align-items:flex-start;text-align:left;border:1px solid #3a3a30;background:#101210;color:#e6e0d0;padding:14px 13px;font-size:12.5px;line-height:1.62;border-radius:2px;letter-spacing:-.2px;transition:border-color .12s,background .12s}
.vd-opt b{flex-shrink:0;font-family:'LoveSerif',serif;font-size:11px;line-height:1.75;color:#d8f983;font-weight:400}
.vd-opt span{flex:1}
.vd-opt:active{border-color:#d8f983;background:#171d12}
.vd-note{position:relative;margin:18px 0 6px;font-size:9px;line-height:1.85;color:#6f6a5e}
.ed-stayline{margin:16px 0 18px;padding:14px 15px;border:1px solid #46573f;background:#0b100a}
.ed-stayline span{display:block;font-size:7.5px;letter-spacing:1.4px;color:#8b8577;margin:0 0 7px}
.ed-stayline b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:400;color:#e9f2d6;letter-spacing:-.35px;margin:0 0 7px;line-height:1.5}
.ed-stayline p{margin:0;font-size:12px;line-height:1.92;color:#c8cfb6}
.ed-stay{margin:0 0 14px;padding:14px 15px;border:1px solid #2b2c25;background:#0a0c0d}
.ed-stay b{display:block;font-family:var(--serif);font-size:15px;line-height:1.7;color:#eee7d4;letter-spacing:-.3px;margin:0 0 8px;overflow-wrap:anywhere}
.ed-stay p{margin:0;font-size:12px;line-height:1.92;color:#b6b0a1}
.ed-pick{padding:14px 15px;border:1px dashed #5a6b3c;background:#0b0f0a;margin:4px 0 0}
.ed-pick span{display:block;font-size:7.5px;letter-spacing:1.4px;color:#8b8577;margin:0 0 7px}
.ed-pick b{display:block;font-family:var(--serif);font-size:17px;font-weight:400;color:#d8f983;letter-spacing:-.2px}
.ed-pick p{margin:7px 0 0;font-size:12px;line-height:1.92;color:#c2cbb0}
@media(max-width:390px){.vd-q{font-size:22px}.vd{padding:20px 17px calc(16px + env(safe-area-inset-bottom))}.vd-opt{font-size:12px;padding:12px}.ed-stayline b{font-size:15px}}
.ed-stay-x{margin:10px 0 0!important;padding:10px 0 0;border-top:1px solid #2a2c24;font-size:12px;line-height:1.92;color:#d8c9b4!important}
.ed-pick-x{margin:9px 0 0!important;padding:9px 0 0;border-top:1px solid #33401f;font-size:12px;line-height:1.92;color:#cfd8bd!important}
.silent-note{display:flex;align-items:center;justify-content:center;gap:9px;margin:8px 0 14px;font-size:12.5px;color:#9aa7b8}
.silent-note span{font-size:9.5px;letter-spacing:.4px;color:#cfe0a9;border:1px solid #4d5a3a;padding:3px 7px;border-radius:2px}
.vd{justify-content:center}
.vd-opts{margin-bottom:0}
@media(max-height:720px){.vd{justify-content:flex-start}}

const PARTNER_TAG={own:['인정','ok'],late:['늦음','mid'],deflect:['변명','bad'],guard:['전가','bad'],ignore:['회피','mid']};
function partnerRead(h,d){
 const rows=[];
 for(let i=0;i<h.length;i++){const e=entryAt(h,i);if(!e)continue;
  const p=isFree(h[i])?(PAT_PREAD[h[i].pat]||PAT_PREAD.short):ROUNDS[i].options[h[i].choice].p;
  rows.push({r:i,title:ROUNDS[i].title,p:p,reply:(e.replies&&e.replies[0])||''})}
 const risk=rows.reduce(function(n,x){return n+(x.p.r||0)},0);
 const own=rows.filter(function(x){return x.p.k==='own'});
 const late=rows.filter(function(x){return x.p.k==='late'});
 const bad=rows.filter(function(x){return x.p.k==='deflect'||x.p.k==='guard'});
 const last=rows[rows.length-1]||null;
 let verdict;
 if(risk>=6)verdict={k:'warn',t:'지금은 너가 접는 쪽으로 굴러가',b:'미안하다는 말은 나오는데 그게 늦고, 자꾸 네 반응에 조건이 붙어. 이대로 가면 다음에도 같은 자리에서 접는 건 너야.'};
 else if(risk>=4)verdict={k:'mid',t:'미안한 마음은 있는데, 전달이 어설퍼',b:'잘못한 건 아는데 그걸 너가 먼저 달래줘야 끝나는 구조야. 나쁜 사람이라서가 아니라, 미루는 버릇이 몸에 밴 거야.'};
 else verdict={k:'ok',t:'최소한 자기가 뭘 잘못했는지는 알아',b:'다섯 번 중에 제대로 인정하는 자리가 있었어. 문제는 인정하고 나서 다음에 어떻게 할지를 안 정한다는 거야.'};
 const list=function(a){return a.length?a.slice().sort(function(x,y){return x.r-y.r}).map(function(x){return 'R'+(x.r+1)}).join('·'):'없어'};
 return {rows:rows,risk:risk,own:own,late:late,bad:bad,last:last,verdict:verdict,
  checks:[
   {q:'미안하다는 말이 늦어도 오긴 하니?',ok:(own.length+late.length)>=3,
    d:'인정한 자리: '+list(own.concat(late))+' / 넘어간 자리: '+list(rows.filter(function(x){return x.p.k==='ignore'||x.p.k==='deflect'||x.p.k==='guard'}))},
   {q:'사과 뒤에 변명이 붙니?',ok:bad.length<2,
    d:(bad.length===0&&own.length===0)?'사과도 변명도 없이 그냥 넘어갔어. 이건 변명보다 나쁜 쪽이야.'
     :bad.length===0?'다섯 번 다 변명 없이 자기 몫만 말했어. 이건 쉽지 않은 거야.'
     :(bad.length===1?'한 번('+list(bad)+')만 변명이 섞였어. 나머지는 자기 몫으로 말했고.'
     :'변명이 먼저 나온 자리: '+list(bad)+'. 사과랑 변명이 같이 오면 상대 기억엔 변명만 남아.')},
   {q:'너가 선을 그으면 물러서니?',ok:!!(last&&last.p.k==='own'),
    d:last?(last.p.k==='own'?'마지막 라운드에서 사과를 바로 받아들였어. 이 사람은 적어도 들을 줄은 알아.':'마지막 라운드에서 사과를 받고도 조건을 붙였어. 물러서기보다 계산이 먼저 나온 거야.'):''}]}}

function stratKeyOf(s){for(const k in STRAT){if(STRAT[k]===s)return k}return 'bow'}
function quoteOf(h,d,s){const mm=mismatch(h,d);let r=mm?mm.round:0;
 if(isSilentEntry(h,r)){let alt=-1;for(let i=0;i<h.length;i++){if(!isSilentEntry(h,i)){alt=i;break}}
  if(alt<0)return {round:r,text:'',tail:''};r=alt}
 if(!entryAt(h,r))r=0;
 const e=entryAt(h,r)||{c:''};
 return {round:r,text:e.c,tail:STRAT[stratKeyOf(s)].quoteTail}}
function quote2Of(h,mm){let best=-1,r=0;
 for(let i=0;i<Math.min(h.length,4);i++){const e=entryAt(h,i);if(!e||isSilentEntry(h,i))continue;
  const sc=(e.f.distance||0)*2+(e.f.concede||0)*1.5+(e.f.retaliate||0)+(e.f.indirect||0);
  if(mm&&i===mm.round)continue;
  if(sc>best){best=sc;r=i}}
 if(isSilentEntry(h,r))return {round:r,text:''};
 return {round:r,text:(entryAt(h,r)||{c:''}).c}}
function roundCards(h,d){const out=[];
 for(let i=0;i<h.length;i++){const e=entryAt(h,i);if(!e)continue;
  const m=motiveAt(i,h,d),free=isFree(h[i]);
  const p=free?(PAT_PREAD[h[i].pat]||PAT_PREAD.short):ROUNDS[i].options[h[i].choice].p;
  out.push({title:ROUNDS[i].title,text:e.c,motive:m?m.c:'',intent:e.intent||'',want:p.w,silent:isSilentEntry(h,i),
   reply:(e.replies&&e.replies[0])||'',pat:free?(e.name||''):'',point:free?(e.point||''):'',
   soft:ALT[i].soft,firm:ALT[i].firm,kind:p.k})}
 return out}

  catch(e){return false}

 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){if(old())ok();else toast('복사가 안 됐어. 말풍선을 길게 눌러서 복사해 줘.')});return}}
 catch(e){}

 for(let i=1;i<words.length;i++){const a=words.slice(0,i).join(' '),b=words.slice(i).join(' ');

function wrapWords(ctx,text,max){
 const words=String(text).split(' '),rows=[];let row='';
 words.forEach(function(wd){const test=row?row+' '+wd:wd;
  if(row&&ctx.measureText(test).width>max){rows.push(row);row=wd}else row=test});
 if(row)rows.push(row);
 for(let guard=0;guard<8&&rows.length>1;guard++){
  const last=rows[rows.length-1];
  if(ctx.measureText(last).width>=max*0.46)break;
  const prev=rows[rows.length-2].split(' ');
  if(prev.length<2)break;
  const moved=prev.pop(),cand=moved+' '+last;
  if(ctx.measureText(cand).width>max)break;
  rows[rows.length-2]=prev.join(' ');rows[rows.length-1]=cand}
 return rows}
function fitLines(ctx,text,max,size,min,family){
 let fs=size,lines;
 for(;;){ctx.font=fs+'px '+family;lines=wrapWords(ctx,text,max);if(lines.length<=2||fs<=min)break;fs-=2}
 return {lines:lines,size:fs}}
function blockLines(ctx,text,max,size,min,maxLines,family){
 let fs=size;
 for(;;){ctx.font=fs+'px '+family;const ls=wrapWords(ctx,text,max);
  if(ls.length<=maxLines||fs<=min)return {lines:ls,size:fs};fs-=1}}
function spWidth(ctx,text,sp){const cs=Array.from(String(text));let t=0;
 cs.forEach(function(c,i){t+=ctx.measureText(c).width+(i<cs.length-1?sp:0)});return t}
function spText(ctx,text,px,y,size,sp,family,color,align){
 ctx.font=size+'px '+family;ctx.fillStyle=color;ctx.textAlign='left';
 const cs=Array.from(String(text)),total=spWidth(ctx,text,sp);
 let cur=align==='center'?px-total/2:(align==='right'?px-total:px);
 cs.forEach(function(c){ctx.fillText(c,cur,y);cur+=ctx.measureText(c).width+sp});
 return total}

  ctx.closePath();ctx.strokeStyle=i?'#cbbda1':'#8d8168';ctx.lineWidth=i?1:1.6;ctx.stroke()});
