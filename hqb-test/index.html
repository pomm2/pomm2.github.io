  else if(id==='info')show('민원 정보 / 무료',game.s.phase==='case'?`<p>${esc(['배정남 / 38세 / 회사원 / A84','이순자 / 62세 / 등록상 무직 / 기존 D38 / 자동 산정 F24','강도훈 / 32세 / 온라인 사업자 / A87'][game.s.index])}</p>${game.patience()?`<p>대기 한도 ${HQB.times(game.patience().limit)} (${esc(game.patience().reason)})</p>`:''}${game.s.index===2?'<p>경제30 / 기여23 / 안정20 / 관계8 / 자기6 = 87</p>':''}`:'<p>심사관 '+esc(game.s.name)+' / 제4심사과 / 9급 시보 / 임용 등급 B등급 68점</p>');
  else if(id==='messages')chatDialog();
  else if(id==='notebook')show('수첩 / '+['배정남','이순자','강도훈'][game.s.index],`<p class="notice">현재 파악한 단서</p><ul class="clues">${game.clues().map(t=>`<li>${ICON.check}<span>${fmt(t)}</span></li>`).join('')||'<li>아직 적은 내용이 없습니다.</li>'}</ul><p class="notice">동료가 보는 나</p><ul class="clues opin">${game.opinions().map(o=>`<li><b>${esc(o.who)}</b><span>${esc(o.text)}</span></li>`).join('')}</ul>`);
  else if(id==='donation'){const text=game.donation();show('기부 및 사회공헌 기록 / 무료',`<p>${esc(text)}</p>`);}
  else if(id==='health')show('자기관리 / 무료','<p>건강검진 2/2 / 습관 1/2 / 건강 1/3 / 의료효율 0/3<br>방문 26회 / 권장 8회. 만성질환 예외 없음.</p>');
  else if(id==='lunch'){if(consent(30,4500))game.lunch(true);}
  else if(id==='skipLunch')game.skipLunch();
  else if(id==='egg-yes'||id==='egg-no')game.egg(id==='egg-yes');
  else if(id==='verdict')verdictDialog();
  else if(id==='defer'){if(confirm('판정 없이 다음 근무일로 이월할까요? 현재 확보 자료는 보존됩니다.'))game.defer();}
  else if(id==='meeting'){if(!game.canSpend(20)||consent(20))game.meeting(true);}
  else if(id.startsWith('meeting-'))game.meetingReply(id.slice(8));
  else if(id.startsWith('motive-'))game.motive(id.slice(7));
  else if(id==='close'){if(game.s.minute>=1080||confirm('남은 자유 행동 기회를 일반 업무로 보내고 퇴근할까요?'))game.close();}
  else if(id.startsWith('N_'))game.evening(id);
  else if(id.startsWith('O_'))game.free(id);
  else {const a=game.actions[game.s.index].find(a=>a.id===id);if(a&&consent(a.minutes))game.act(id,true);}
 }catch(err){error=err.message;}
 render();
 // 아래쪽 버튼을 눌러 새 대사가 시작되면 화면을 맨 위로: 조회 창·인물이 있는 장면이 헤더 밑에 가려지지 않게 (폰)
 if(!hadDialogue&&game.s.dialogue.length>0){document.documentElement.scrollTop=0;document.body.scrollTop=0;}
});
render();
</script></body></html>
