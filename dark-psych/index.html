/* ===== STYLE ===== */
:root{
  --bg:#0c0c0d;
  --bg2:#121214;
  --panel:#141416;
  --ink:#ece6d9;
  --body:#c5bfb1;
  --dim:#817c72;
  --faint:#5b574f;
  --line:#26262a;
  --line2:#1b1b1e;
  --red:#c0473a;
  --bone:#e9e1cf;
  --serif:'DPSerif','AppleMyungjo','Nanum Myeongjo',serif;
  --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:15px;line-height:1.62;word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.045) .5px,transparent .6px);
  background-size:3px 3px;
}
#app{position:relative;z-index:1}
.page{
  width:100%;max-width:440px;margin:0 auto;min-height:100dvh;
  padding:18px 20px calc(22px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.page>*{animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.mono{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mono.red{color:var(--red)}
.tiny{font-size:11px;color:var(--faint);line-height:1.5;margin:12px 0 0;letter-spacing:.01em}

.mast{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:9px;border-bottom:1px solid var(--line)}
.mast .mono{font-size:9.5px;letter-spacing:.19em}

/* ---------- intro ---------- */
.intro{justify-content:space-between}
.intro-body{padding-top:34px}
.stamp{
  display:inline-block;border:1px solid #7d352c;color:#c95344;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  padding:3px 7px 2px;transform:rotate(-3deg);margin-bottom:22px;
}
.kicker{margin:0 0 14px;letter-spacing:.22em;font-size:9.5px}
h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(30px,8.6vw,37px);
  line-height:1.34;letter-spacing:-.01em;color:var(--ink);margin:0;
}
h1 em{font-style:normal;color:var(--bone);border-bottom:1px solid var(--red);padding-bottom:1px}
.lede{margin:14px 0 0;color:var(--body);font-size:14px}
.docline{
  display:flex;margin:26px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--dim);
}
.docline span{flex:1;padding:9px 0;text-align:center;border-right:1px solid var(--line2)}
.docline span:first-child{text-align:left}
.docline span:last-child{text-align:right;border-right:0}
.intro-note{margin:18px 0 0;font-size:12.5px;line-height:1.7;color:var(--dim)}
.intro-foot{padding-top:20px}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:14px 15px;background:transparent;color:var(--ink);
  border:1px solid #35353b;border-radius:2px;
  font-family:inherit;font-size:14px;letter-spacing:-.01em;cursor:pointer;
  transition:background .15s ease,color .15s ease,transform .1s ease;
}
.btn span:last-child{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.btn.pri{background:var(--bone);border-color:var(--bone);color:#121212;font-weight:600}
.btn.pri span:last-child{color:#4a453c}
.btn:active{transform:translateY(1px)}
.btn.ghost{border-color:transparent;color:var(--dim);justify-content:center;font-size:12.5px;padding:11px}
.btn+.btn{margin-top:9px}

/* ---------- case ---------- */
.ticks{display:flex;gap:3px;margin:12px 0 20px}
.ticks i{flex:1;height:2px;background:#26262a}
.ticks i.on{background:#8f897c}
.ticks i.cur{background:var(--red)}
.ctitle{
  font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.4;
  color:var(--ink);margin:0 0 8px;letter-spacing:-.01em;
}
.sit{margin:0 0 16px;font-size:13.5px;line-height:1.72;color:var(--body)}

.chat{border:1px solid var(--line);background:#101012}
.chat-top{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line2)}
.chat-top .who{font-size:11.5px;color:#b7b1a5;letter-spacing:.02em}
.chat-top .meta{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--faint)}
.chat-body{padding:12px 11px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:7px;align-items:flex-start;max-width:100%}
.row.me{flex-direction:row-reverse}
.av{
  flex:0 0 auto;width:25px;height:25px;margin-top:1px;
  border:1px solid #33333a;display:grid;place-items:center;
  font-family:var(--serif);font-size:11.5px;color:#a9a294;background:#17171a;
}
.bub{
  max-width:77%;background:#1b1b1f;border:1px solid #27272c;
  padding:7px 10px;border-radius:2px;font-size:12.8px;line-height:1.55;color:#ded8ca;
}
.row.me .bub{background:var(--bone);border-color:var(--bone);color:#17150f}
.row .time{font-family:var(--mono);font-size:8px;color:var(--faint);align-self:flex-end;padding-bottom:2px;letter-spacing:.06em}
.note{margin:14px 0 0;padding-left:11px;border-left:1px solid var(--red);font-size:12.8px;line-height:1.7;color:#b9b3a6}

.prompt{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 2px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.prompt .mono:first-child{color:var(--ink);font-size:10px;letter-spacing:.18em}
.opts{display:flex;flex-direction:column}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line2);
  padding:13px 2px;color:var(--body);font-family:inherit;font-size:13.5px;line-height:1.58;
  cursor:pointer;transition:background .13s ease,color .13s ease;
}
.opt .no{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--faint);padding-top:4px;flex:0 0 auto}
.opt .tx{flex:1}
.opt:active{background:#171719;color:var(--ink)}
.opt:focus-visible{outline:1px solid var(--red);outline-offset:-1px}
.after{padding-top:16px}
.after .btn{margin-top:16px}

/* ---------- result ---------- */
.result{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 0}
.num{display:flex;align-items:baseline;gap:2px;font-family:var(--serif);color:var(--ink)}
.num b{font-weight:400;font-size:clamp(66px,20vw,86px);line-height:.84;letter-spacing:-.045em}
.num i{font-style:normal;font-size:21px;color:var(--red);font-family:var(--mono);letter-spacing:-.02em;padding-bottom:9px}
.gradebox{text-align:right;padding-bottom:4px}
.gradebox .mono{display:block;font-size:8.5px;margin-bottom:2px}
.gradebox strong{
  display:block;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1;color:var(--bone);
}
.gradebox .gname{display:block;margin-top:5px;font-size:10.5px;color:var(--dim);letter-spacing:.02em}
.facts{margin:9px 0 0;font-size:8.6px;letter-spacing:.17em;color:var(--faint)}
.gline{margin:12px 0 0;font-size:13px;line-height:1.6;color:#b6b0a3;border-top:1px solid var(--line);padding-top:12px}

.tblock{margin:30px 0 0}
.tblock h2{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.3;color:var(--ink);margin:6px 0 0;letter-spacing:-.015em}
.alias{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--red);margin:7px 0 0;text-transform:uppercase}
.ttag{font-family:var(--serif);font-size:15.5px;line-height:1.55;color:var(--bone);margin:14px 0 0}
.tbody{margin:10px 0 0;font-size:13.5px;line-height:1.78;color:var(--body)}

.doc{border:1px solid var(--line);background:var(--panel);padding:14px 14px 16px;margin-top:18px}
.doc-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:12px}
.doc-h .mono{font-size:9px;letter-spacing:.2em;color:#a9a396}
.doc-h .mono.dim{color:var(--faint)}

.radar{display:block;width:100%;height:auto;margin:2px 0 4px}
.radar text{font-family:var(--mono);fill:#8d887d}
.radar .ax{font-size:8.4px;letter-spacing:.04em}
.radar .val{font-size:8.4px;fill:#b9b2a3}
.radar .grid{fill:none;stroke:#2b2b31;stroke-width:.9}
.radar .spoke{stroke:#232329;stroke-width:.9}
.radar .poly{fill:rgba(192,71,58,.16);stroke:#c0473a;stroke-width:1.5;stroke-linejoin:round}
.radar .dot{fill:#d0564a}

.bars{margin-top:6px;display:flex;flex-direction:column;gap:7px}
.bar{display:flex;align-items:center;gap:9px;font-size:11px;color:#a9a396}
.bar .bl{flex:0 0 74px;letter-spacing:-.01em}
.bar .bt{flex:1;height:3px;background:#242429;position:relative;overflow:hidden}
.bar .bt i{position:absolute;inset:0 auto 0 0;background:#8d4137;display:block}
.bar .bv{flex:0 0 26px;text-align:right;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.04em}

.skill{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2)}
.skill:last-child{border-bottom:0;padding-bottom:2px}
.skill .sk-no{font-family:var(--mono);font-size:9px;color:var(--faint);padding-top:3px;letter-spacing:.08em}
.skill .sk-name{font-family:var(--serif);font-size:16.5px;color:var(--ink);line-height:1.35}
.skill .sk-en{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--faint);margin-top:3px}
.skill .sk-tr{margin-top:5px;font-size:12.3px;line-height:1.6;color:#b0aa9d}

.ev{padding:11px 0;border-bottom:1px solid var(--line2)}
.ev:last-child{border-bottom:0;padding-bottom:2px}
.ev .ev-q{
  font-family:var(--serif);font-size:14.5px;line-height:1.6;color:var(--ink);
  margin:0 0 8px;text-indent:-.42em;padding-left:.42em;
}
.ev .ev-k{font-size:12.2px;line-height:1.55;color:#b7b1a4;margin:0}
.ev .ev-k b{color:var(--bone);font-weight:600}
.ev .ev-t{margin:4px 0 0;font-size:11.6px;line-height:1.55;color:var(--dim)}

.gc{margin-top:4px}
.gc .row{margin-bottom:7px}
.gc .row:last-child{margin-bottom:0}

.pc{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.pc .item{padding-left:11px;border-left:1px solid var(--line)}
.pc .item.plus{border-left-color:#6d8a5e}
.pc .item.minus{border-left-color:var(--red)}
.pc .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;display:block;margin-bottom:4px;color:var(--dim)}
.pc .item.plus .lab{color:#8ba276}
.pc .item.minus .lab{color:#c0675b}
.pc p{margin:0;font-size:12.5px;line-height:1.65;color:#b3ada0}

.acts{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.result .tiny{margin-top:16px}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--bone);color:#141312;padding:10px 16px;border-radius:2px;
  font-size:12.5px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.45);
  animation:toastIn .24s ease both;max-width:calc(100% - 40px);
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

@media (max-width:360px){
  .page{padding-left:16px;padding-right:16px}
  .bar .bl{flex-basis:66px;font-size:10.4px}
  .num b{font-size:62px}

function gradeOf(index){
  for (var i=0;i<GRADES.length;i++){ if (index>=GRADES[i].min) return GRADES[i]; }
  return GRADES[GRADES.length-1];
}

/* ans: 고른 선택지 번호 배열 (SITUATIONS 순서) */
function analyze(ans){
  var total=0, wsum=0, darkActs=0, i;
  var raw={};
  AXES.forEach(function(a){ raw[a.k]=0; });
  SITUATIONS.forEach(function(s,n){
    var pick=(ans[n]===null||ans[n]===undefined)?0:ans[n];
    var o=s.opts[pick]||s.opts[0];
    total+=o.d;
    if(o.d>=2) darkActs++;
    o.ax.forEach(function(k,j){
      var w=j===0?1:0.5;
      raw[k]=(raw[k]||0)+o.d*w;
      wsum+=o.d*w;
    });
  });

  var axes=AXES.map(function(a){
    var v=wsum>0?Math.round(100*raw[a.k]/wsum):0;
    return {k:a.k,name:a.name,en:a.en,tr:a.tr,value:v,raw:raw[a.k]};
  });
  if(wsum>0){
    var sum=axes.reduce(function(t,a){return t+a.value;},0);
    var diff=100-sum;
    if(diff!==0){
      var top=axes.slice().sort(function(a,b){return b.value-a.value||b.raw-a.raw;})[0];
      top.value+=diff;
    }
  }

  total=0;
  SITUATIONS.forEach(function(s,n){
    var pick=(ans[n]===null||ans[n]===undefined)?0:ans[n];
    total+=(s.opts[pick]||s.opts[0]).d;
  });
  var index=Math.round(100*total/(SITUATIONS.length*3));
  var grade=gradeOf(index);
  var sorted=axes.slice().sort(function(a,b){return b.value-a.value||b.raw-a.raw;});

  var typeKey;
  if(index<=24) typeKey='pure';
  else if(index>=70 && (sorted[0].value-sorted[1].value)<=7) typeKey='master';
  else typeKey=sorted[0].k;

  /* 방금 네가 한 말: 다크 점수 높은 순 3개 (없으면 그나마 센 것) */
  var all=[];
  SITUATIONS.forEach(function(s,n){
    var pick=(ans[n]===null||ans[n]===undefined)?0:ans[n];
    var o=s.opts[pick]||s.opts[0];
    all.push({n:n,sit:s,opt:o});
  });
  var strong=all.filter(function(x){return x.opt.d>=2;})
                .sort(function(a,b){return b.opt.d-a.opt.d||b.n-a.n;});
  var evidence=strong.slice(0,3);
  if(evidence.length<2){
    var mild=all.filter(function(x){return x.opt.d===1;}).slice(0,2);
    evidence=evidence.concat(mild).slice(0,3);
  }
  var axesUsed=axes.filter(function(a){return a.value>0;}).length;

  return {
    index:index, grade:grade, typeKey:typeKey, type:TYPES[typeKey],
    axes:axes, sorted:sorted, top:sorted[0], second:sorted[1],
    evidence:evidence, darkActs:darkActs, axesUsed:axesUsed, total:total
  };
}

  var s=SITUATIONS[state.i];

  var ticks='';
  for(var k=0;k<SITUATIONS.length;k++){
    ticks+='<i class="'+(k<state.i?'on':(k===state.i?'cur':''))+'"></i>';
  }
  var html='<div class="page case">'
    +'<header class="mast"><span class="mono">CASE '+s.no+' / 09</span><span class="mono dim">'+esc(s.tag)+'</span></header>'
    +'<div class="ticks">'+ticks+'</div>'

      +'<div class="opts">';

      +'<button class="btn pri" data-act="next"><span>'+(state.i===SITUATIONS.length-1?'결과 보기':'다음')+'</span><span>'+(state.i+1)+' / 09</span></button></div>';
  }
  return html+'</div>';
}

/* ---------- radar ---------- */
function radarSvg(axes){
  var S=320,cx=160,cy=152,R=100,SCALE=40;
  var pt=function(i,r){var a=-Math.PI/2+Math.PI*2*i/6;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  var out='<svg class="radar" viewBox="0 0 320 300" role="img" aria-label="다크심리학 사용 성분 육각 그래프">';
  [1,.72,.44].forEach(function(k,j){
    out+='<polygon class="grid" points="';
    for(var i=0;i<6;i++){var p=pt(i,R*k);out+=(i?' ':'')+p[0].toFixed(1)+','+p[1].toFixed(1);}
    out+='"/>';
  });
  for(var i=0;i<6;i++){var p=pt(i,R);out+='<line class="spoke" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>';}
  out+='<polygon class="poly" points="';
  axes.forEach(function(a,j){var p=pt(j,R*Math.max(Math.min(a.value/SCALE,1),0.015));out+=(j?' ':'')+p[0].toFixed(1)+','+p[1].toFixed(1);});
  out+='"/>';
  axes.forEach(function(a,j){var p=pt(j,R*Math.max(Math.min(a.value/SCALE,1),0.015));out+='<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.4"/>';});
  axes.forEach(function(a,j){
    var p=pt(j,R+26);
    var anchor=(Math.abs(p[0]-cx)<10)?'middle':(p[0]>cx?'start':'end');
    var dy=(p[1]<cy-40)?-2:(p[1]>cy+40?9:0);
    out+='<text class="ax" x="'+p[0].toFixed(1)+'" y="'+(p[1]+dy).toFixed(1)+'" text-anchor="'+anchor+'">'+esc(a.name)+'</text>';
    out+='<text class="val" x="'+p[0].toFixed(1)+'" y="'+(p[1]+dy+11).toFixed(1)+'" text-anchor="'+anchor+'">'+a.value+'</text>';
  });
  return out+'</svg>';
}

/* ---------- toast ---------- */
function toast(msg){
  var old=document.querySelector('.toast');
  if(old)old.remove();
  var d=document.createElement('div');
  d.className='toast';d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}

/* ---------- story poster (1080x1920) ---------- */
function wrapChars(ctx,text,max){
  var rows=[],row='';
  var chars=Array.from(String(text));
  for(var i=0;i<chars.length;i++){
    var ch=chars[i];
    if(ch==='\n'){rows.push(row);row='';continue}
    var test=row+ch;
    if(row&&ctx.measureText(test).width>max){rows.push(row);row=ch}else{row=test}
  }
  if(row)rows.push(row);
  return rows;
}
function fitSize(ctx,text,max,size,min,maxLines,family){
  var fs=size;
  for(;;){
    ctx.font=fs+'px '+family;
    var ls=wrapChars(ctx,text,max);
    if(ls.length<=maxLines||fs<=min)return {size:fs,lines:ls};
    fs-=2;
  }
}
function spText(ctx,text,x,y,size,sp,color,align,family){
  family=family||'sans-serif';
  ctx.fillStyle=color;ctx.font=size+'px '+family;ctx.textAlign='left';
  var chars=Array.from(String(text));
  var total=0;
  chars.forEach(function(c,i){total+=ctx.measureText(c).width+(i<chars.length-1?sp:0)});
  var cur=align==='center'?x-total/2:(align==='right'?x-total:x);
  chars.forEach(function(c){ctx.fillText(c,cur,y);cur+=ctx.measureText(c).width+sp});
  return total;
}

async function storyBlob(){
  var an=analyze(state.ans),t=an.type;

  var W=1080,H=1920;

  var x=c.getContext('2d');
  var BG='#0c0c0d',INK='#ece6d9',BODY='#bdb7a9',DIM='#7e796f',LINE='#2a2a2e',RED='#c0473a',BONE='#e9e1cf';

  x.fillStyle=BG;x.fillRect(0,0,W,H);
  /* 종이 대신 아주 옅은 인쇄 점 */
  var seed=913;
  for(var i=0;i<9000;i++){
    seed=(seed*16807)%2147483647;var a=seed/2147483647;
    seed=(seed*16807)%2147483647;var b=seed/2147483647;
    x.fillStyle='rgba(255,255,255,.05)';x.fillRect(a*W,b*H,1.4,1.4);
  }
  /* 판면 테두리 + 모서리 표시 */
  x.strokeStyle='#232327';x.lineWidth=1;
  [[52,52,1,1],[W-52,52,-1,1],[52,H-52,1,-1],[W-52,H-52,-1,-1]].forEach(function(m){
    x.beginPath();x.moveTo(m[0]+26*m[2],m[1]);x.lineTo(m[0],m[1]);x.lineTo(m[0],m[1]+26*m[3]);x.stroke();
  });

  spText(x,'DARK PSYCHOLOGY INDEX',84,112,20,3.4,DIM);
  spText(x,'FILE 07',W-84,112,20,3.4,DIM,'right');
  x.strokeStyle=LINE;x.beginPath();x.moveTo(84,140);x.lineTo(W-84,140);x.stroke();

  x.textAlign='left';x.fillStyle=DIM;x.font='22px DPSerif';
  x.fillText('다크심리학 사용 지수',84,250);

  /* 숫자 */
  var num=String(an.index);
  var ns=num.length>=3?250:300;
  x.fillStyle=INK;x.font=ns+'px DPSerif';
  x.fillText(num,84,556);
  var nw=x.measureText(num).width;
  x.fillStyle=RED;x.font='64px DPSerif';
  x.fillText('%',84+nw+6,556);

  /* 등급 */
  x.textAlign='right';
  x.fillStyle=DIM;x.font='20px DPSerif';
  x.fillText('등급',W-84,430);
  x.fillStyle=BONE;x.font='132px DPSerif';
  x.fillText(an.grade.g,W-84,540);
  x.fillStyle=DIM;x.font='24px DPSerif';
  x.fillText(an.grade.label,W-84,584);

  x.strokeStyle=LINE;x.beginPath();x.moveTo(84,640);x.lineTo(W-84,640);x.stroke();

  /* 유형 */
  x.textAlign='left';
  var tn=fitSize(x,t.name,W-168,74,44,1,'DPSerif');
  x.fillStyle=INK;x.font=tn.size+'px DPSerif';
  x.fillText(tn.lines[0],84,730);
  spText(x,t.alias,84,776,21,2.4,RED,'left','DPSerif');

  var tl=fitSize(x,t.tag,W-168,31,23,2,'DPSerif');
  x.fillStyle=BODY;x.font=tl.size+'px DPSerif';
  tl.lines.forEach(function(ln,k){x.fillText(ln,84,830+k*42)});

  /* 육각 그래프 */
  var cx=540,cy=1160,R=196;
  var pt=function(i,r){var a=-Math.PI/2+Math.PI*2*i/6;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  [1,.72,.44].forEach(function(k,j){
    x.beginPath();
    for(var q=0;q<6;q++){var p=pt(q,R*k);q?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}
    x.closePath();x.strokeStyle=j?'#232327':'#34343a';x.lineWidth=1.2;x.stroke();
  });
  for(var q=0;q<6;q++){var p=pt(q,R);x.beginPath();x.moveTo(cx,cy);x.lineTo(p[0],p[1]);x.strokeStyle='#202025';x.lineWidth=1;x.stroke();}
  x.beginPath();
  an.axes.forEach(function(a,j){var p=pt(j,R*Math.max(Math.min(a.value/40,1),0.015));j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);});
  x.closePath();x.fillStyle='rgba(192,71,58,.16)';x.fill();x.strokeStyle=RED;x.lineWidth=2.6;x.stroke();
  an.axes.forEach(function(a,j){var p=pt(j,R*Math.max(Math.min(a.value/40,1),0.015));
    x.beginPath();x.arc(p[0],p[1],5,0,Math.PI*2);x.fillStyle='#d0564a';x.fill();});
  x.textAlign='center';x.font='21px DPSerif';
  an.axes.forEach(function(a,j){
    var p=pt(j,R+42);
    x.fillStyle=BODY;x.fillText(a.name,p[0],p[1]);
    x.fillStyle='#6f6a60';x.font='18px DPSerif';x.fillText(String(a.value),p[0],p[1]+24);

  /* 주력 스킬 한 줄 */
  x.textAlign='left';
  var sk=an.sorted.filter(function(a){return a.value>0;}).slice(0,2);

  var trl=fitSize(x,sk[0].tr,W-168,26,19,2,'DPSerif');
  x.fillStyle=DIM;x.font=trl.size+'px sans-serif';
  trl.lines.forEach(function(ln,k){x.fillText(ln,84,1606+k*36)});

  /* 푸터 */
  x.strokeStyle=LINE;x.beginPath();x.moveTo(84,1780);x.lineTo(W-84,1780);x.stroke();
  spText(x,'나, 은근히 다크심리학 쓰고 있나?',84,1826,22,0.6,BODY,'left','DPSerif');
  x.textAlign='right';x.fillStyle=DIM;x.font='20px sans-serif';
  x.fillText('pomm2.github.io/dark-psych',W-84,1826);
  x.textAlign='left';x.fillStyle='#5b574f';x.font='18px DPSerif';
  x.fillText('재미로 보는 테스트 · 심리 진단 아님',84,1862);

  return await new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('image'))},'image/png')});
}

async function saveStory(){
  try{
    var blob=await storyBlob();
    var u=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=u;a.download='dark-psych-story.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},6000);
    toast('결과 이미지를 저장했어. 다운로드 목록 확인해봐.');
  }catch(e){toast('이미지를 만들지 못했어. 다시 한 번 눌러줘.')}
}

function shareText(){
  var an=analyze(state.ans),t=an.type;
  return TITLE+'\n다크심리학 사용 지수 '+an.index+'% · 등급 '+an.grade.g+' · '+t.name+'\n'+LINK;
}

async function share(){
  var an=analyze(state.ans),t=an.type,text=shareText();
  try{
    var blob=await storyBlob();
    var file=new File([blob],'dark-psych-story.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:TITLE,text:text});
      return;
    }
    if(navigator.share){await navigator.share({title:TITLE,text:text});return}
    if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('결과와 링크를 복사했어.');return}
    toast('이 브라우저에선 공유가 안 돼. 이미지 저장을 이용해줘.');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    try{if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('결과와 링크를 복사했어.');return}}catch(_){}
    toast('공유가 안 되면 이미지 저장을 이용해줘.');
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='start'){
    state.phase='play';state.i=0;state.ans=new Array(SITUATIONS.length).fill(null);state.picked=null;
    save();render();window.scrollTo(0,0);
  }else if(act==='pick'){
    var k=parseInt(el.getAttribute('data-i'),10);
    state.ans[state.i]=k;state.picked=k;save();render();
  }else if(act==='next'){
    if(state.i>=SITUATIONS.length-1){state.phase='result';save();render();}
    else{state.i++;state.picked=null;save();render();}
    window.scrollTo(0,0);
  }else if(act==='save'){saveStory()}
  else if(act==='share'){share()}
  else if(act==='again'){
    try{localStorage.removeItem(KEY)}catch(e){}
    state.phase='intro';state.i=0;state.ans=new Array(SITUATIONS.length).fill(null);state.picked=null;
    render();window.scrollTo(0,0);
  }
});
